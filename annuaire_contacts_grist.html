  const STAR_ICON = (filled) => `<svg viewBox="0 0 24 24" fill="${filled ? "currentColor" : "none"}"
    stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
    <path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>`;

  /* Navigation au clavier dans une liste déroulante : ↑ ↓ Entrée Échap */
  function enableListNav(input, box, itemSelector) {

    input.addEventListener("keydown", (e) => {

      if (!["ArrowDown", "ArrowUp", "Enter", "Escape"].includes(e.key) || e.isComposing) return;

      if (!box.classList.contains("open")) {
        if (e.key === "ArrowDown") input.dispatchEvent(new Event("focus"));
        return;
      }

      if (e.key === "Escape") {
        box.classList.remove("open");
        return;
      }

      const items = Array.from(box.querySelectorAll(itemSelector));
      if (!items.length) return;

      let i = items.findIndex(x => x.classList.contains("active"));

      if (e.key === "Enter") {
        const target = i >= 0 ? items[i] : items.find(x => !x.classList.contains("create-item"));
        if (target) {
          e.preventDefault();
          target.click();
        }
        return;
      }

      e.preventDefault();

      i = e.key === "ArrowDown"
        ? (i + 1) % items.length
        : (i <= 0 ? items.length - 1 : i - 1);

      items.forEach(x => x.classList.remove("active"));
      items[i].classList.add("active");
      items[i].scrollIntoView({ block: "nearest" });
    });
  }

  /* CLASSEMENT DES CONTACTS */

  const sorted = () =>
    state.contacts.slice().sort((a, b) => {
      const A = contactData(a);
      const B = contactData(b);

      return normalize(A.last || A.first)
        .localeCompare(normalize(B.last || B.first), "fr");
    });

  const closeResults = () =>
    $("results").classList.remove("open");

  /* RÉSULTATS DE RECHERCHE */

  function renderResults() {

    const query = $("searchInput").value;

    $("clearSearch").style.display = query ? "block" : "none";

    const q = normalize(query);

    if (!q) return closeResults();

    const contactMatches = sorted().filter(r => {

      const c = contactData(r);

      return normalize([
        c.first,
        c.last,
        c.organisation
      ].join(" ")).includes(q);

    }).slice(0, 50);

    const orgMatches = state.organisations
      .filter(o => normalize(o.name).includes(q))
      .slice(0, 50);

    const entries = [
      ...contactMatches.map(rec => ({ kind: "contact", rec })),
      ...orgMatches.map(org => ({ kind: "org", org }))
    ];

    const box = $("results");

    if (!entries.length) {

      box.innerHTML = `
        <div class="empty-results">
          Aucun contact ni organisation ne correspond à « ${escapeHtml(query)} ».
        </div>
        <button class="result-item create-item" type="button" data-new-contact>
          + Créer un nouveau contact
        </button>`;

      box.querySelector("[data-new-contact]").addEventListener("click", renderCreateForm);

    } else {

      const itemHtml = (entry, i) => {

        if (entry.kind === "contact") {
          const c = contactData(entry.rec);
          const detail = [c.organisation, c.role].filter(Boolean).join(" · ");

          return `
            <button class="result-item rich" type="button" role="option" data-i="${i}">
              <span class="result-icon contact" title="Contact">${PERSON_ICON}</span>
              <span class="result-body">
                <span class="result-name">${escapeHtml(fullName(c) || "Contact sans nom")}</span>
                ${detail ? `<span class="result-detail">${escapeHtml(detail)}</span>` : ""}
              </span>
            </button>`;
        }

        return `
          <button class="result-item rich" type="button" role="option" data-i="${i}">
            <span class="result-icon org" title="Organisation">${BUILDING_ICON}</span>
            <span class="result-body">
              <span class="result-name">${escapeHtml(entry.org.name)}<span class="result-tag">Organisation</span></span>
              ${entry.org.detail ? `<span class="result-detail">${escapeHtml(entry.org.detail)}</span>` : ""}
            </span>
          </button>`;
      };

      let html = `<div class="results-meta">${entries.length} résultat${entries.length > 1 ? "s" : ""}</div>`;

      if (contactMatches.length) {
        html += `<div class="results-group">Contacts</div>` +
          contactMatches.map((_, i) => itemHtml(entries[i], i)).join("");
      }

      if (orgMatches.length) {
        html += `<div class="results-group">Organisations</div>` +
          orgMatches.map((_, i) => itemHtml(entries[contactMatches.length + i], contactMatches.length + i)).join("");
      }

      box.innerHTML = html;

      box.querySelectorAll(".result-item").forEach(btn => {

        btn.addEventListener("click", () => {

          const entry = entries[Number(btn.dataset.i)];

          state.creating = false;
          closeResults();
          $("clearSearch").style.display = "block";

          if (entry.kind === "contact") {

            state.view = "contact";
            state.selectedId = entry.rec.id;

            $("searchInput").value = fullName(contactData(entry.rec));

            focusInGrist(entry.rec.id);
            renderProfile(entry.rec);

          } else {

            state.selectedId = null;
            $("searchInput").value = entry.org.name;

            openOrganisation(entry.org.id, entry.org.name);
          }

        });

      });
    }

    box.classList.add("open");
  }

  /* Les organisations sont chargées en arrière-plan pour la recherche (au plus toutes les 30 s) */
  let orgSearchLoading = false;
  let orgSearchLastLoad = 0;

  function ensureOrganisationsForSearch() {

    if (orgSearchLoading || Date.now() - orgSearchLastLoad < 30000) return;

    orgSearchLoading = true;
    orgSearchLastLoad = Date.now();

    loadOrganisationOptions().finally(() => {
      orgSearchLoading = false;
      if ($("searchInput").value.trim() && !state.creating) renderResults();
    });
  }

  /* ÉVÉNEMENTS DE RECHERCHE */

  $("searchInput").addEventListener("input", () => {

    if (!state.creating) {
      state.view = "contact";
      state.selectedId = null;
      if (state.mapped) renderHome();
    }

    ensureOrganisationsForSearch();
    renderResults();
  });

  $("searchInput").addEventListener("focus", () => {

    ensureOrganisationsForSearch();

    if ($("searchInput").value.trim()) renderResults();

  });

  enableListNav($("searchInput"), $("results"), ".result-item");

  $("clearSearch").addEventListener("click", () => {

    $("searchInput").value = "";

    closeResults();

    if (!state.creating) {
      state.selectedId = null;
      if (state.mapped) renderHome();
    }

    $("clearSearch").style.display = "none";
    $("searchInput").focus();

  });

  document.addEventListener("click", (e) => {

    const orgSearch = $("organisationSearch");
    const orgOptions = $("organisationOptions");

    if (orgSearch && orgOptions && !orgSearch.parentElement.contains(e.target)) {
      orgOptions.classList.remove("open");
    }

    if (!$("searchWrap").contains(e.target)) closeResults();

  });

        title: "Prénom",
        type: "Any",
        description: "Prénom du contact"
      },

      {
        name: "lastName",
        title: "Nom",
        type: "Any",
        description: "Nom de famille du contact"
      },

      {
        name: "contactId",
        title: "Identifiant du contact",
        type: "Any",
        optional: true
      },

      {
        name: "organisation",
        title: "Organisation (nom)",
        type: "Any",
        optional: true,
        description: "Colonne formule (lecture seule), ex. $Organisation.Nom_de_l_organisation"
      },

      {
        name: "organisationRef",
        title: "Organisation (référence)",
        type: "Any",
        optional: true,
        description: "Colonne de la table Contacts qui pointe vers une organisation (type Référence), pas la formule du nom : ouvre la fiche, rattache les contacts, sert à la création"
      },

      {
        name: "organisationUrl",
        title: "Lien vers la fiche organisation",
        type: "Any",
        optional: true,
        description: "Colonne formule : lien d'ancrage vers la fiche de l'organisation"
      },

      {
        name: "role",
        title: "Fonction / rôle",
        type: "Any",
        optional: true
      },

      {
        name: "email",
        title: "Adresse e-mail",
        type: "Any",
        optional: true
      },

      {
        name: "phone",
        title: "Téléphone",
        type: "Any",
        optional: true
      },

      {
        name: "linkedin",
        title: "Profil LinkedIn (URL)",
        type: "Any",
        optional: true
      },

      {
        name: "active",
        title: "Contact actif",
        type: "Any",
        optional: true,
        description: "Case à cocher (ou Oui/Non)"
      },

      {
        name: "comments",
        title: "Commentaires",
        type: "Any",
        optional: true
      },

      {
        name: "createdAt",
        title: "Date de création",
        type: "Any",
        optional: true,
        description: "Colonne Date ou Date+Heure"
      },

      {
        name: "updatedAt",
        title: "Dernière modification",
        type: "Any",
        optional: true,
        description: "Colonne Date ou Date+Heure"
      }

    ]

  });

  /* RÉCEPTION DES DONNÉES GRIST */

  grist.onRecords((rawRecords, mappings) => {

    state.mappings = mappings || null;

    const records = rawRecords
      ? grist.mapColumnNames(rawRecords)
      : null;

    if (!records) {

      state.mapped = false;
      state.contacts = [];

      renderBlank(
        "Associez les colonnes",
        "Ouvrez le panneau de droite de Grist, rubrique « Colonnes », puis associez au minimum le prénom et le nom."
      );

      $("status").textContent = "";
      return;
    }

    state.mapped = true;
    state.contacts = records;

    if (state.creating || state.view === "org") return;   // formulaire ou fiche organisation ouverts : on n'y touche pas

    const current = state.selectedId != null
      ? records.find(r => r.id === state.selectedId)
      : null;

    if (current) {
      renderProfile(current);

      if (state.pendingCursorId === current.id) {
        focusInGrist(current.id);
        state.pendingCursorId = null;
      }
    } else {
      state.selectedId = null;
      renderHome();
    }

    $("status").textContent =
      `${records.length} contact${records.length > 1 ? "s" : ""} chargé${records.length > 1 ? "s" : ""}.`;

  });

  renderBlank(
    "Chargement…",
    "En attente des données de Grist."
  );

})();
</script>

</body>
</html>
