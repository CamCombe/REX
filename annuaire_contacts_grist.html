<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire des contacts – Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      --navy: #193B60; --text: #202B36; --muted: #687684; --line: #E2E7EC; --soft: #F4F6F8;
      --accent: #2877B8; --green: #2E9E5B; --red: #C0453F;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background: #fff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; font-size: 14px; }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .app { width: 100%; max-width: 920px; margin: 0 auto; padding: 16px; }
    .eyebrow { color: var(--muted); font-size: 11px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 12px; }
    .search-wrap { position: relative; margin-bottom: 14px; }
    .search-box { display: flex; align-items: center; gap: 10px; border: 1px solid #D6DEE6; border-radius: 11px; padding: 0 12px; min-height: 46px; background: #fff; transition: border .15s, box-shadow .15s; }
    .search-box:focus-within { border-color: #7FA8CB; box-shadow: 0 0 0 3px rgba(40,119,184,.10); }
    .search-icon { color: #778594; flex: 0 0 auto; }
    .search-box input { border: 0; outline: 0; width: 100%; min-width: 0; background: transparent; color: var(--text); }
    .clear-btn { border: 0; background: transparent; color: #778594; font-size: 19px; padding: 2px 4px; display: none; }
    .results { position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 6px); background: #fff; border: 1px solid var(--line); border-radius: 11px; box-shadow: 0 12px 30px rgba(20,39,58,.13); max-height: 300px; overflow: auto; display: none; }
    .results.open { display: block; }
    .results-meta { padding: 9px 12px; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--line); }
    .result-item { width: 100%; display: block; text-align: left; border: 0; border-bottom: 1px solid #EEF1F4; background: #fff; padding: 11px 13px; }
    .result-item:last-child { border-bottom: 0; }
    .result-item:hover { background: #F3F7FA; }
    .result-name { display: block; color: #23384C; font-weight: 750; margin-bottom: 3px; }
    .result-detail { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .empty-results { padding: 16px 13px; color: var(--muted); }
    .profile { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; }
    .banner { background: var(--navy); color: #fff; padding: 22px 22px 20px; }
    .banner-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: #C7D7E5; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .banner-right { display: flex; align-items: center; gap: 10px; }
    .contact-id { font-variant-numeric: tabular-nums; font-weight: 600; }
    .pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 11px; color: #fff; font-size: 11px; font-weight: 750; letter-spacing: .04em; }
    .pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #fff; opacity: .9; }
    .pill.on { background: var(--green); }
    .pill.off { background: var(--red); }
    .person-name { margin: 13px 0 6px; font-size: clamp(23px, 4vw, 31px); line-height: 1.12; letter-spacing: -.035em; font-weight: 780; overflow-wrap: anywhere; }
    .org-name { color: #F2F6FA; font-size: 15px; font-weight: 650; margin-top: 3px; }
    a.org-link { color: #fff; text-decoration: underline; text-decoration-color: rgba(255,255,255,.45); text-underline-offset: 3px; }
    a.org-link:hover { text-decoration-color: #fff; }
    .role { color: #C8D8E6; font-size: 13px; margin-top: 5px; line-height: 1.45; }
    .profile-body { padding: 21px 22px 23px; }
    .section-title { margin: 0 0 13px; color: #34495D; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .075em; }
    .contact-row { display: flex; align-items: center; gap: 13px; padding: 11px 0; border-bottom: 1px solid #EDF0F3; min-width: 0; }
    .contact-row:first-child { padding-top: 2px; }
    .contact-row:last-child { border-bottom: 0; padding-bottom: 2px; }
    .contact-icon { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; background: #F0F3F6; color: #526A80; }
    .contact-icon.li { background: #EAF2FA; color: #0A66C2; }
    .contact-copy { min-width: 0; flex: 1; }
    .contact-label { display: block; color: #7A8793; font-size: 11px; margin-bottom: 3px; }
    .contact-value { color: #273B4E; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    a.contact-value { text-decoration: none; }
    a.contact-value:hover { color: var(--accent); text-decoration: underline; }
    .comments-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .comments { background: #F5F7F9; border-radius: 10px; padding: 13px 14px; color: #465665; font-size: 13px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
    .blank-state { border: 1px dashed #CFD8E1; border-radius: 14px; padding: 34px 20px; text-align: center; background: #FAFBFC; }
    .blank-icon { width: 44px; height: 44px; border-radius: 13px; margin: 0 auto 13px; background: #EAF0F5; color: #47647F; display: flex; align-items: center; justify-content: center; }
    .blank-title { color: #34495D; font-weight: 750; font-size: 15px; margin-bottom: 5px; }
    .blank-text { color: var(--muted); font-size: 12px; line-height: 1.5; max-width: 420px; margin: 0 auto; }
    .status { color: var(--muted); font-size: 11px; margin-top: 12px; min-height: 15px; }
    @media (max-width: 560px) { .app { padding: 11px; } .banner { padding: 18px 16px; } .profile-body { padding: 17px 16px 19px; } }
  </style>
</head>
<body>
  <main class="app">
    <div class="eyebrow">Annuaire des contacts</div>
    <div class="search-wrap" id="searchWrap">
      <div class="search-box">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Rechercher par nom, prénom ou organisation…" aria-label="Rechercher un contact">
        <button class="clear-btn" id="clearSearch" title="Effacer la recherche" aria-label="Effacer la recherche">×</button>
      </div>
      <div class="results" id="results" role="listbox"></div>
    </div>
    <div id="mainContent"></div>
    <div class="status" id="status" aria-live="polite"></div>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const state = { contacts: [], selectedId: null, mapped: false };

  const isBlank = (v) => v === null || v === undefined || v === "" || (Array.isArray(v) && v.length === 0);
  const text = (v) => {
    if (isBlank(v)) return "";
    if (Array.isArray(v)) return v.map(text).filter(Boolean).join(", ");
    if (typeof v === "object") return v.name ? String(v.name) : "";
    return String(v).trim();
  };
  const escapeHtml = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const normalize = (v) => String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("fr").trim();
  const safeUrl = (v) => {
    const s = text(v);
    if (!s) return "";
    return /^https?:\/\//i.test(s) ? s : "https://" + s.replace(/^\/+/, "");
  };
  const toBool = (v) => {
    if (v === true) return true;
    if (v === false) return false;
    if (isBlank(v)) return null;
    return ["true", "1", "oui", "yes", "vrai", "actif", "active", "x"].includes(normalize(v));
  };
  const fullName = (c) => [c.first, c.last.toLocaleUpperCase("fr")].filter(Boolean).join(" ");

  function contactData(r) {
    return {
      id: text(r.contactId), first: text(r.firstName), last: text(r.lastName),
      organisation: text(r.organisation), orgUrl: safeUrl(r.organisationUrl),
      role: text(r.role), email: text(r.email), landline: text(r.landline), mobile: text(r.mobile),
      linkedin: safeUrl(r.linkedin), active: toBool(r.active), comments: text(r.comments)
    };
  }

  function renderBlank(title = "Rechercher un contact", msg = "Saisissez un nom, un prénom ou une organisation dans la barre de recherche pour consulter une fiche.") {
    $("mainContent").innerHTML = `<div class="blank-state">
      <div class="blank-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.5-3.3 2.7-5 6-5s5.5 1.7 6 5"/><path d="M16 8h5M18.5 5.5v5"/></svg></div>
      <div class="blank-title">${escapeHtml(title)}</div><p class="blank-text">${escapeHtml(msg)}</p></div>`;
  }

  const ICONS = {
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    phone: '<path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2z"/>',
    mobile: '<rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/>'
  };
  const LINKEDIN_PATH = "M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z";
  function icon(type) {
    if (type === "linkedin") return `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="${LINKEDIN_PATH}"/></svg>`;
    return `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICONS[type]}</svg>`;
  }
  function row(type, label, value, href, display) {
    if (!value) return "";
    const v = href
      ? `<a class="contact-value" href="${escapeHtml(href)}" ${href.startsWith("http") ? 'target="_blank" rel="noopener noreferrer"' : ""}>${escapeHtml(display || value)}</a>`
      : `<div class="contact-value">${escapeHtml(value)}</div>`;
    return `<div class="contact-row"><div class="contact-icon ${type === "linkedin" ? "li" : ""}">${icon(type)}</div>
      <div class="contact-copy"><span class="contact-label">${escapeHtml(label)}</span>${v}</div></div>`;
  }
  const tel = (s) => s ? "tel:" + s.replace(/[^\d+]/g, "") : "";

  function renderProfile(rec) {
    const c = contactData(rec);
    const hasCoords = !!(c.email || c.landline || c.mobile || c.linkedin);
    const pill = c.active === null ? "" : `<span class="pill ${c.active ? "on" : "off"}">${c.active ? "Actif" : "Inactif"}</span>`;
    const org = c.organisation
      ? (c.orgUrl
          ? `<a class="org-link" href="${escapeHtml(c.orgUrl)}" target="_blank" rel="noopener noreferrer" title="Ouvrir la fiche de l'organisation">${escapeHtml(c.organisation)}</a>`
          : escapeHtml(c.organisation))
      : "";
    $("mainContent").innerHTML = `<article class="profile">
      <header class="banner">
        <div class="banner-meta"><span>Fiche contact</span>
          <div class="banner-right">${c.id ? `<span class="contact-id">${escapeHtml(c.id)}</span>` : ""}${pill}</div></div>
        <h1 class="person-name">${escapeHtml(fullName(c) || "Contact")}</h1>
        ${org ? `<div class="org-name">${org}</div>` : ""}
        ${c.role ? `<div class="role">${escapeHtml(c.role)}</div>` : ""}
      </header>
      <div class="profile-body">
        ${hasCoords ? `<section><h2 class="section-title">Coordonnées</h2><div>
          ${row("mail", "Adresse e-mail", c.email, c.email ? "mailto:" + c.email : "")}
          ${row("phone", "Téléphone fixe", c.landline, tel(c.landline))}
          ${row("mobile", "Téléphone mobile", c.mobile, tel(c.mobile))}
          ${row("linkedin", "LinkedIn", c.linkedin, c.linkedin, "Voir le profil LinkedIn")}
        </div></section>` : ""}
        ${c.comments ? `<section class="comments-section"><h2 class="section-title">Commentaires</h2><div class="comments">${escapeHtml(c.comments)}</div></section>` : ""}
        ${!hasCoords && !c.comments ? `<div class="blank-text">Aucune coordonnée ni commentaire renseigné pour ce contact.</div>` : ""}
      </div></article>`;
  }

  const sorted = () => state.contacts.slice().sort((a, b) => {
    const A = contactData(a), B = contactData(b);
    return normalize(A.last || A.first).localeCompare(normalize(B.last || B.first), "fr");
  });
  const closeResults = () => $("results").classList.remove("open");

  function renderResults() {
    const query = $("searchInput").value;
    $("clearSearch").style.display = query ? "block" : "none";
    const q = normalize(query);
    if (!q) return closeResults();
    const matches = sorted().filter(r => {
      const c = contactData(r);
      return normalize([c.first, c.last, c.organisation].join(" ")).includes(q);
    });
    const box = $("results");
    if (!matches.length) {
      box.innerHTML = `<div class="empty-results">Aucun contact ne correspond à « ${escapeHtml(query)} ».</div>`;
    } else {
      const shown = matches.slice(0, 100);
      box.innerHTML = `<div class="results-meta">${matches.length} résultat${matches.length > 1 ? "s" : ""}</div>` +
        shown.map((r, i) => {
          const c = contactData(r);
          const detail = [c.organisation, c.role].filter(Boolean).join(" · ");
          return `<button class="result-item" type="button" role="option" data-i="${i}">
            <span class="result-name">${escapeHtml(fullName(c) || "Contact sans nom")}</span>
            ${detail ? `<span class="result-detail">${escapeHtml(detail)}</span>` : ""}</button>`;
        }).join("");
      box.querySelectorAll(".result-item").forEach(btn => btn.addEventListener("click", () => {
        const chosen = shown[Number(btn.dataset.i)];
        state.selectedId = chosen.id;
        $("searchInput").value = fullName(contactData(chosen));
        $("clearSearch").style.display = "block";
        closeResults();
        renderProfile(chosen);
      }));
    }
    box.classList.add("open");
  }

  $("searchInput").addEventListener("input", () => { state.selectedId = null; if (state.mapped) renderBlank(); renderResults(); });
  $("searchInput").addEventListener("focus", () => { if ($("searchInput").value.trim()) renderResults(); });
  $("clearSearch").addEventListener("click", () => {
    $("searchInput").value = ""; state.selectedId = null; closeResults();
    if (state.mapped) renderBlank();
    $("clearSearch").style.display = "none"; $("searchInput").focus();
  });
  document.addEventListener("click", (e) => { if (!$("searchWrap").contains(e.target)) closeResults(); });

  // Mapping natif Grist : panneau de droite > « Colonnes » du widget.
  grist.ready({
    requiredAccess: "read table",
    columns: [
      { name: "firstName", title: "Prénom", type: "Any", description: "Prénom du contact" },
      { name: "lastName", title: "Nom", type: "Any", description: "Nom de famille du contact" },
      { name: "contactId", title: "Identifiant du contact", type: "Any", optional: true },
      { name: "organisation", title: "Organisation (nom)", type: "Any", optional: true, description: "Colonne texte ou formule, ex. $Organisation.Nom" },
      { name: "organisationUrl", title: "Lien vers la fiche organisation", type: "Any", optional: true, description: "URL complète ouverte au clic sur le nom de l'organisation" },
      { name: "role", title: "Fonction / rôle", type: "Any", optional: true },
      { name: "email", title: "Adresse e-mail", type: "Any", optional: true },
      { name: "landline", title: "Téléphone fixe", type: "Any", optional: true },
      { name: "mobile", title: "Téléphone mobile", type: "Any", optional: true },
      { name: "linkedin", title: "Profil LinkedIn (URL)", type: "Any", optional: true },
      { name: "active", title: "Contact actif", type: "Any", optional: true, description: "Case à cocher (ou Oui/Non)" },
      { name: "comments", title: "Commentaires", type: "Any", optional: true }
    ]
  });

  grist.onRecords((rawRecords) => {
    // Applique la correspondance définie dans le panneau « Colonnes » (null si elle est incomplète).
    const records = rawRecords ? grist.mapColumnNames(rawRecords) : null;
    if (!records) {
      state.mapped = false; state.contacts = [];
      renderBlank("Associez les colonnes", "Ouvrez le panneau de droite de Grist, rubrique « Colonnes », puis associez au minimum le prénom et le nom.");
      $("status").textContent = "";
      return;
    }
    state.mapped = true;
    state.contacts = records;
    const current = state.selectedId != null ? records.find(r => r.id === state.selectedId) : null;
    if (current) renderProfile(current);
    else { state.selectedId = null; renderBlank(); }
    $("status").textContent = `${records.length} contact${records.length > 1 ? "s" : ""} chargé${records.length > 1 ? "s" : ""}.`;
  });

  renderBlank("Chargement…", "En attente des données de Grist.");
})();
</script>
</body>
</html>
