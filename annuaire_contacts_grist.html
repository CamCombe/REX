<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annuaire des contacts – Grist</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <!-- Règles de numérotation des pays étrangers (facultatif : sans elle, seuls les numéros français sont formatés) -->
  <script src="https://cdn.jsdelivr.net/npm/libphonenumber-js@1.11/bundle/libphonenumber-min.js"></script>

  <style>
    :root {
      --navy: #193B60;
      --text: #202B36;
      --muted: #687684;
      --line: #E2E7EC;
      --soft: #F4F6F8;
      --accent: #2877B8;
      --green: #2E9E5B;
      --red: #C0453F;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: #fff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; font-size: 14px; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 16px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    /* RECHERCHE */

    .search-wrap { position: relative; margin-bottom: 14px; }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid #D6DEE6;
      border-radius: 11px;
      padding: 0 12px;
      min-height: 46px;
      background: #fff;
      transition: border .15s, box-shadow .15s;
    }

    .search-box:focus-within {
      border-color: #7FA8CB;
      box-shadow: 0 0 0 3px rgba(40,119,184,.10);
    }

    .search-icon { color: #778594; flex: 0 0 auto; }

    .search-box input {
      border: 0;
      outline: 0;
      width: 100%;
      min-width: 0;
      background: transparent;
      color: var(--text);
    }

    .clear-btn {
      border: 0;
      background: transparent;
      color: #778594;
      font-size: 19px;
      padding: 2px 4px;
      display: none;
    }

    .results {
      position: absolute;
      z-index: 20;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 11px;
      box-shadow: 0 12px 30px rgba(20,39,58,.13);
      max-height: 300px;
      overflow: auto;
      display: none;
    }

    .results.open { display: block; }

    .results-meta {
      padding: 9px 12px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      border-bottom: 1px solid var(--line);
    }

    .result-item {
      width: 100%;
      display: block;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #EEF1F4;
      background: #fff;
      padding: 11px 13px;
    }

    .result-item:last-child { border-bottom: 0; }
    .result-item:hover { background: #F3F7FA; }

    .result-name {
      display: block;
      color: #23384C;
      font-weight: 750;
      margin-bottom: 3px;
    }

    .result-detail {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .empty-results { padding: 16px 13px; color: var(--muted); }

    .create-item {
      color: var(--accent);
      font-weight: 700;
      border-top: 1px solid #EEF1F4;
    }

    /* FICHE ORGANISATION */

    button.org-name {
      background: none;
      border: 0;
      padding: 0;
      text-align: left;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.4);
      text-underline-offset: 3px;
    }

    button.org-name:hover { text-decoration-color: #fff; }

    .back-btn {
      border: 0;
      background: rgba(255,255,255,.12);
      color: #fff;
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .back-btn:hover { background: rgba(255,255,255,.22); }

    .org-title-line { margin: 13px 0 4px; display: flex; }

    .org-title-line .autogrow {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 780;
      letter-spacing: -.03em;
      line-height: 1.15;
    }

    .org-title-line .editable-field { color: #fff; }
    .org-title-line .editable-field::placeholder { color: #B8C9D8; }

    .org-summary { color: #C8D8E6; font-size: 13px; margin-top: 6px; line-height: 1.45; }

    .org-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 18px 26px;
    }

    .org-field { min-width: 0; padding: 0 2px; }

    .org-readonly {
      color: #273B4E;
      font-size: 13px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .org-field select.editable-field { font-size: 13px; color: #273B4E; }

    .org-open-dark {
      color: #718294;
      display: inline-flex;
      padding: 5px;
      border-radius: 6px;
      flex: 0 0 auto;
    }

    .org-open-dark:hover { background: #EDF3F7; color: #315D80; }

    .org-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .tags { display: flex; flex-wrap: wrap; gap: 7px; }

    .tag {
      background: #EAF0F5;
      color: #34495D;
      border-radius: 999px;
      padding: 4px 11px;
      font-size: 12px;
      font-weight: 650;
    }

    .muted-note { color: var(--muted); font-size: 12px; }

    .org-contact {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid #EDF0F3;
      background: #fff;
      padding: 10px 4px;
    }

    .org-contact:last-child { border-bottom: 0; }
    .org-contact:hover { background: #F3F7FA; }
    .org-contact .n { font-weight: 700; color: #23384C; }
    .org-contact .r { color: var(--muted); font-size: 12px; text-align: right; }

    /* BOUTONS D'ACTION */

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 17px;
      font-size: 13px;
      font-weight: 700;
    }

    .btn-primary { background: var(--navy); color: #fff; }
    .btn-primary:hover { filter: brightness(1.12); }
    .btn-primary:disabled { opacity: .6; cursor: default; }

    .btn-secondary { background: #EEF2F6; color: #34495D; }
    .btn-secondary:hover { background: #E3E9EF; }

    .blank-state .btn { margin-top: 17px; }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .form-note {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-top: 12px;
    }

    /* FICHE CONTACT */

    .profile {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
    }

    .banner {
      background: var(--navy);
      color: #fff;
      padding: 22px 22px 20px;
    }

    .banner-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: #C7D7E5;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .banner-right { display: flex; align-items: center; gap: 10px; }
    .contact-id {
      font-variant-numeric: tabular-nums;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: .02em;
      text-transform: none;
      opacity: .7;
    }

    .role {
      color: #C8D8E6;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.45;
    }

    .profile-body { padding: 21px 22px 23px; }

    .section-title {
      margin: 0 0 13px;
      color: #34495D;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .075em;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 11px 0;
      border-bottom: 1px solid #EDF0F3;
      min-width: 0;
    }

    .contact-row:first-child { padding-top: 2px; }
    .contact-row:last-child { border-bottom: 0; padding-bottom: 2px; }

    .contact-icon {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F0F3F6;
      color: #526A80;
    }

    .contact-icon.li {
      background: #EAF2FA;
      color: #0A66C2;
    }

    .contact-copy { min-width: 0; flex: 1; }

    .contact-label {
      display: block;
      color: #7A8793;
      font-size: 11px;
      margin-bottom: 3px;
    }

    /* COMMENTAIRES */

    .comments-section {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .blank-state {
      border: 1px dashed #CFD8E1;
      border-radius: 14px;
      padding: 34px 20px;
      text-align: center;
      background: #FAFBFC;
    }

    .blank-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      margin: 0 auto 13px;
      background: #EAF0F5;
      color: #47647F;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .blank-title {
      color: #34495D;
      font-weight: 750;
      font-size: 15px;
      margin-bottom: 5px;
    }

    .blank-text {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      max-width: 420px;
      margin: 0 auto;
    }

    .status {
      color: var(--muted);
      font-size: 11px;
      margin-top: 12px;
      min-height: 15px;
    }

    .meta-foot {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 18px;
      padding: 11px 22px;
      border-top: 1px solid var(--line);
      background: #FAFBFC;
      color: #8A96A2;
      font-size: 11px;
    }

    /* CHAMPS MODIFIABLES */

    .editable-field {
      width: 100%;
      min-width: 0;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 7px;
      margin: -5px -7px;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 1.4;
      transition: background .15s, border-color .15s;
    }

    .editable-field:hover {
      background: rgba(40,119,184,.045);
      border-color: #D9E4ED;
    }

    .editable-field:focus {
      outline: none;
      background: #fff;
      border-color: #80A9CC;
      box-shadow: 0 0 0 3px rgba(40,119,184,.10);
      color: var(--text);
    }

    .editable-field::placeholder {
      color: #A0AAB4;
      font-weight: 400;
      opacity: 1;
    }

    /* PRENOM / NOM : largeur ajustée au texte */

    .name-fields {
      display: flex;
      align-items: baseline;
      gap: .28em;               /* espace standard entre prénom et nom */
      margin: 13px 0 6px;
      width: 100%;
      min-width: 0;
      font-size: clamp(23px, 4vw, 31px);
      line-height: 1.12;
      letter-spacing: -.035em;
      font-weight: 780;
    }

    .name-fields .autosize {
      display: inline-grid;
      grid-template-columns: minmax(0, 1fr);
      flex: 0 1 auto;
      min-width: 0;
      margin: -5px -7px;        /* compense le padding des champs */
    }

    /* texte invisible qui impose la largeur du champ */
    .name-fields .autosize::after {
      content: attr(data-value);
      grid-area: 1 / 1;
      visibility: hidden;
      white-space: pre;
      overflow: hidden;
      padding: 4px 6px;
      border: 1px solid transparent;
    }

    .name-fields .autosize > .editable-field {
      grid-area: 1 / 1;
      /* width:0 + min-width:100% : la largeur par défaut de l'input
         (≈ 20 caractères) ne compte plus, seul le texte invisible
         (::after) dicte la taille */
      width: 0;
      min-width: 100%;
      margin: 0;
      padding: 4px 6px;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      color: #fff;
    }

    .name-fields .autosize-last { text-transform: uppercase; }

    .name-fields .editable-field::placeholder { color: #B8C9D8; }

    .org-edit-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .org-edit-line .editable-field {
      color: #F2F6FA;
      font-size: 15px;
      font-weight: 650;
    }

    /* ORGANISATION : nom en lecture seule, cliquable vers la fiche */

    .org-name {
      min-width: 0;
      color: #F2F6FA;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.4;
      overflow-wrap: anywhere;   /* un nom long passe sur plusieurs lignes */
    }

    a.org-name {
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.4);
      text-underline-offset: 3px;
    }

    a.org-name:hover { text-decoration-color: #fff; }

    .org-name.empty {
      color: #9FB4C8;
      font-weight: 400;
      font-style: italic;
    }

    /* (zone de texte extensible, conservée au cas où) */

    .autogrow {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      flex: 1 1 0;
      min-width: 0;
      margin: -5px -7px;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.4;
    }

    /* texte invisible qui impose la hauteur de la zone de texte */
    .autogrow::after {
      content: attr(data-value) " ";
      grid-area: 1 / 1;
      visibility: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      padding: 5px 7px;
      border: 1px solid transparent;
    }

    .autogrow > textarea.editable-field {
      grid-area: 1 / 1;
      display: block;
      width: 0;
      min-width: 100%;
      margin: 0;
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font: inherit;
    }

    .org-open {
      color: #E6F0F8;
      display: inline-flex;
      padding: 5px;
      border-radius: 6px;
      opacity: .8;
      flex: 0 0 auto;
    }

    .org-open:hover { background: rgba(255,255,255,.12); opacity: 1; }
    .role .editable-field { color: #C8D8E6; font-size: 13px; }

    .contact-value-wrap {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .contact-value-wrap .editable-field {
      color: #273B4E;
      font-size: 13px;
    }

    /* BOUTONS COPIE */

    .copy-btn {
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 7px;
      color: #718294;
      background: transparent;
      padding: 0;
    }

    .copy-btn:hover { background: #EDF3F7; color: #315D80; }
    .copy-btn.copied { color: var(--green); background: #EAF6EF; }
    .copy-btn svg { width: 16px; height: 16px; }

    .copy-feedback {
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    /* LINKEDIN : AFFICHAGE DU LOGO ET DU LIEN */

    .linkedin-display {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
    }

    .linkedin-link {
      color: #0A66C2;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .linkedin-link:hover { text-decoration: underline; }

    .edit-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #718294;
      cursor: pointer;
    }

    .edit-link-btn:hover { background: #EDF3F7; color: #315D80; }

    /* COMMENTAIRES MODIFIABLES */

    .comments-editor {
      display: block;
      width: 100%;
      min-height: 94px;
      resize: vertical;
      background: #F5F7F9;
      border: 1px solid #E6EBEF;
      border-radius: 10px;
      padding: 12px 14px;
      color: #465665;
      font: inherit;
      font-size: 13px;
      line-height: 1.6;
    }

    .comments-editor:focus {
      outline: none;
      background: #fff;
      border-color: #80A9CC;
      box-shadow: 0 0 0 3px rgba(40,119,184,.10);
    }

    .comments-editor::placeholder { color: #9AA6B1; }

    /* STATUT */

    .status-toggle {
      border: 0;
      color: #fff;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    .status-toggle.on { background: var(--green); }
    .status-toggle.off { background: var(--red); }
    .status-toggle.unknown { background: #738292; }
    .status-toggle:hover { filter: brightness(1.06); }

    .edit-hint {
      color: rgba(255,255,255,.63);
      font-size: 10px;
      margin-top: 9px;
    }

    .contact-row .contact-value-wrap { flex: 1; }

    /* BANNIÈRE : texte sombre quand le champ passe en édition (fond blanc) */

    .banner :is(input, textarea).editable-field:focus {
      color: var(--text);
    }

    .banner :is(input, textarea).editable-field:focus::placeholder {
      color: #8A96A2;
    }

    /* CODE COULEUR : fiche organisation (vert-bleu) / fiche contact (bleu marine) */

    .profile.org .banner { background: #1F5F5B; }
    .profile.org .banner-meta { color: #CDE6E2; }
    .profile.org .section-title { color: #1F4F4C; }
    .profile.org .tag { background: #E3F1EF; color: #1F5F5B; }
    .profile.org .back-btn { background: rgba(255,255,255,.14); }

    .tiny-id {
      margin-top: 3px;
      font-size: 9px;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
      opacity: .7;
    }

    .org-title {
      font-size: clamp(22px, 4vw, 28px);
      font-weight: 780;
      letter-spacing: -.03em;
      line-height: 1.15;
      overflow-wrap: anywhere;
    }

    .org-badges { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }

    .badge-type, .badge-sector {
      border-radius: 999px;
      padding: 3px 11px;
      font-size: 12px;
      font-weight: 700;
    }

    .badge-type {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.4);
      color: #fff;
    }

    .badge-sector { background: rgba(255,255,255,.1); color: #E4F3F1; font-weight: 600; }

    .edit-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 8px;
      background: rgba(255,255,255,.14);
      color: #fff;
    }

    .edit-toggle:hover { background: rgba(255,255,255,.26); }
    .edit-toggle.on { background: #fff; color: #1F5F5B; }

    .org-site { color: var(--accent); font-size: 13px; overflow-wrap: anywhere; text-decoration: none; }
    .org-site:hover { text-decoration: underline; }

    .org-comment { white-space: pre-wrap; }

    /* Secteurs : édition */
    .tag-x {
      border: 0;
      background: transparent;
      color: inherit;
      opacity: .65;
      font-size: 14px;
      line-height: 1;
      padding: 0 0 0 6px;
    }

    .tag-x:hover { opacity: 1; }

    .sector-add { display: flex; gap: 8px; margin-top: 12px; }

    .sector-add input {
      flex: 1;
      min-width: 0;
      border: 1px solid #D6DEE6;
      border-radius: 9px;
      padding: 9px 12px;
      outline: none;
      color: var(--text);
    }

    .sector-add input:focus {
      border-color: #7FB3AE;
      box-shadow: 0 0 0 3px rgba(31,95,91,.12);
    }

    /* Contacts rattachés : 2 colonnes, contact principal en tête */
    .oc-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 28px;
    }

    .oc-row {
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: 1px solid #EDF0F3;
    }

    .oc-open {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 9px 4px;
      border-radius: 6px;
    }

    .oc-open:hover { background: #F1F7F6; }
    .oc-open .n { font-weight: 700; color: #23384C; font-size: 13px; overflow-wrap: anywhere; }
    .oc-open .r { color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }

    .oc-star {
      flex: 0 0 24px;
      width: 24px;
      height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      padding: 0;
      color: #C5CDD5;
      border-radius: 6px;
    }

    .oc-star svg { width: 16px; height: 16px; }
    .oc-star.on { color: #E0A100; }
    button.oc-star:hover { background: #F4F1E4; color: #E0A100; }

    /* Recherche : contacts et organisations */
    .result-item.rich { display: flex; align-items: center; gap: 11px; }
    .result-item.active, .organisation-option.active { background: #E6F0F8; }

    .results-group {
      padding: 8px 13px 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: #FAFBFC;
    }

    .result-icon {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .result-icon svg { width: 17px; height: 17px; }
    .result-icon.contact { background: #E7EEF5; color: #193B60; }
    .result-icon.org { background: #E1F0EE; color: #1F5F5B; }

    .result-body { min-width: 0; flex: 1; }

    .result-tag {
      display: inline-block;
      margin-left: 7px;
      padding: 1px 7px;
      border-radius: 999px;
      background: #E1F0EE;
      color: #1F5F5B;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .03em;
      vertical-align: 1px;
    }

    @media (max-width: 560px) {
      .oc-grid { grid-template-columns: 1fr; }
    }

    /* SÉLECTEUR D'ORGANISATION (création de contact) */

    .organisation-create { margin-bottom: 22px; position: relative; }

    .organisation-create label {
      display: block;
      color: #34495D;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .075em;
      margin-bottom: 10px;
    }

    .organisation-search { position: relative; }

    .organisation-search input {
      width: 100%;
      border: 1px solid #D6DEE6;
      border-radius: 9px;
      padding: 11px 13px;
      background: #fff;
      color: var(--text);
      outline: none;
    }

    .organisation-search input:focus {
      border-color: #80A9CC;
      box-shadow: 0 0 0 3px rgba(40,119,184,.10);
    }

    .organisation-options {
      position: absolute;
      z-index: 30;
      top: calc(100% + 5px);
      left: 0;
      right: 0;
      display: none;
      max-height: 240px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 9px;
      box-shadow: 0 10px 25px rgba(20,39,58,.13);
    }

    .organisation-options.open { display: block; }

    .organisation-option {
      display: block;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      border-bottom: 1px solid #EEF1F4;
      background: #fff;
      text-align: left;
      color: var(--text);
      font-size: 13px;
    }

    .organisation-option:last-child { border-bottom: 0; }
    .organisation-option:hover { background: #F3F7FA; }

    .organisation-empty { padding: 12px; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .organisation-selected {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      padding: 10px 12px;
      border: 1px solid #DCE9E1;
      border-radius: 9px;
      background: #F3F8F5;
      color: #285B3D;
      font-size: 13px;
    }

    .organisation-selected strong { font-weight: 700; overflow-wrap: anywhere; }

    .organisation-clear {
      flex: 0 0 auto;
      border: 0;
      background: transparent;
      color: #718294;
      font-size: 18px;
      padding: 0 3px;
    }

    .organisation-clear:hover { color: var(--red); }

    .organisation-help { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.45; }

    @media (max-width: 560px) {
      .meta-foot { padding: 10px 16px; }
      .app { padding: 11px; }
      .banner { padding: 18px 16px; }
      .profile-body { padding: 17px 16px 19px; }
    }
  </style>
</head>

<body>
<main class="app">

  <div class="eyebrow">Annuaire des contacts</div>

  <div class="search-wrap" id="searchWrap">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="m20 20-4-4"/>
      </svg>

      <input id="searchInput" type="search" autocomplete="off"
        placeholder="Rechercher par nom, prénom ou organisation…"
        aria-label="Rechercher un contact">

      <button class="clear-btn" id="clearSearch"
        title="Effacer la recherche" aria-label="Effacer la recherche">×</button>
    </div>

    <div class="results" id="results" role="listbox"></div>
  </div>

  <div id="mainContent"></div>
  <div class="status" id="status" aria-live="polite"></div>

</main>

<script>
(() => {

  const $ = (id) => document.getElementById(id);

  const state = {
    contacts: [],
    selectedId: null,
    mapped: false,
    mappings: null,
    currentRecord: null,
    creating: false,
    pendingCursorId: null,
    view: "contact",

    organisations: [],
    selectedOrganisationId: null,
    organisationsLoaded: false,
    organisationsError: ""
  };

  /* OUTILS */

  const isBlank = (v) =>
    v === null || v === undefined || v === "" ||
    (Array.isArray(v) && v.length === 0);

  const text = (v) => {
    if (isBlank(v)) return "";
    if (Array.isArray(v)) return v.map(text).filter(Boolean).join(", ");
    if (typeof v === "object") return v.name ? String(v.name) : "";
    return String(v).trim();
  };

  const escapeHtml = (v) =>
    String(v ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[c]));

  const normalize = (v) =>
    String(v ?? "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .toLocaleLowerCase("fr")
      .trim();

  const safeUrl = (v) => {
    const s = text(v);
    if (!s) return "";
    return /^https?:\/\//i.test(s)
      ? s
      : "https://" + s.replace(/^\/+/, "");
  };

  /* FORMATAGE DES NUMÉROS DE TÉLÉPHONE
     - France (0X XX XX XX XX ou +33 …) : affichage national, par groupes de 2
     - Autres pays (+XX …) : format international propre au pays
     - Tout le reste (texte, plusieurs numéros, poste…) : laissé tel quel */

  function formatPhone(raw) {
    const input = String(raw ?? "").trim();
    if (!input) return "";

    // Lettres, séparateurs de plusieurs numéros : on ne touche à rien
    if (/[A-Za-z;,/]/.test(input)) return input;

    // Retire espaces, points, tirets, parenthèses ; 00 devient +
    const n = input.replace(/[\s.\-()]/g, "").replace(/^00/, "+");
    if (!/^\+?\d+$/.test(n)) return input;

    const pairs = (digits) => digits.replace(/(\d{2})(?=\d)/g, "$1 ");

    // France : 0X XX XX XX XX
    if (/^0[1-9]\d{8}$/.test(n)) return pairs(n);

    // France en notation internationale : +33 6 12 34 56 78 (ou +33 (0)6…)
    const fr = n.match(/^\+33(?:0)?([1-9]\d{8})$/);
    if (fr) return pairs("0" + fr[1]);

    // Autres pays : bibliothèque libphonenumber-js
    if (n.startsWith("+") && typeof libphonenumber !== "undefined") {
      try {
        const p = libphonenumber.parsePhoneNumberFromString(n);
        if (p && p.isPossible()) return p.formatInternational();
      } catch (e) { /* on garde la saisie */ }
    }

    return input;
  }

  const toBool = (v) => {
    if (v === true) return true;
    if (v === false) return false;
    if (isBlank(v)) return null;

    return ["true", "1", "oui", "yes", "vrai", "actif", "active", "x"]
      .includes(normalize(v));
  };

  /* DATES GRIST */

  const fmtDate = (v) => {
    if (isBlank(v)) return "";

    let d = null;
    let dateOnly = false;

    if (typeof v === "number") {
      const ms = v < 1e11 ? v * 1000 : v;
      d = new Date(ms);
      dateOnly = ms % 86400000 === 0;
    } else {
      const s = text(v);

      if (/^\d{4}-\d{2}-\d{2}(T|\s|$)/.test(s)) {
        d = new Date(s);
        dateOnly = s.length === 10;
      } else {
        return s;
      }
    }

    if (isNaN(d)) return text(v);

    return dateOnly
      ? d.toLocaleDateString("fr-FR", {
          timeZone: "UTC",
          day: "2-digit",
          month: "2-digit",
          year: "numeric"
        })
      : d.toLocaleString("fr-FR", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }).replace(",", " à");
  };

  const fullName = (c) =>
    [c.first, c.last.toLocaleUpperCase("fr")]
      .filter(Boolean)
      .join(" ");

  /* NORMALISATION DES ENREGISTREMENTS */

  function contactData(r) {
    return {
      rowId: r.id,
      id: text(r.contactId),
      first: text(r.firstName),
      last: text(r.lastName),
      organisation: text(r.organisation),
      orgUrl: safeUrl(r.organisationUrl),
      orgRef: toRowId(r.organisationRef),
      role: text(r.role),
      email: text(r.email),
      phone: formatPhone(text(r.phone)),
      linkedin: safeUrl(r.linkedin),
      active: toBool(r.active),
      comments: text(r.comments),
      created: fmtDate(r.createdAt),
      updated: fmtDate(r.updatedAt)
    };
  }

  /* ÉTAT VIDE */

  function renderBlank(
    title = "Rechercher un contact",
    msg = "Saisissez un nom, un prénom ou une organisation dans la barre de recherche pour consulter une fiche.",
    canCreate = false
  ) {
    $("mainContent").innerHTML = `
      <div class="blank-state">
        <div class="blank-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
            stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.5"/>
            <path d="M3 20c.5-3.3 2.7-5 6-5s5.5 1.7 6 5"/>
            <path d="M16 8h5M18.5 5.5v5"/>
          </svg>
        </div>
        <div class="blank-title">${escapeHtml(title)}</div>
        <p class="blank-text">${escapeHtml(msg)}</p>
        ${canCreate
          ? `<button class="btn btn-primary" type="button" data-new-contact>
              + Nouveau contact
            </button>`
          : ""}
      </div>`;

    const newBtn = $("mainContent").querySelector("[data-new-contact]");
    if (newBtn) newBtn.addEventListener("click", renderCreateForm);
  }

  /* Place le curseur de Grist sur la ligne du contact : les widgets liés à
     celui-ci (« Sélectionner par ») affichent alors l'organisation correspondante. */
  function focusInGrist(rowId) {
    if (rowId == null) return;
    try {
      Promise.resolve(grist.setCursorPos({ rowId })).catch(() => {});
    } catch (e) { /* sans effet si le lien n'est pas utilisé */ }
  }

  /* Écran d'accueil (aucun contact sélectionné) */
  const renderHome = () => renderBlank(undefined, undefined, true);

  /* CRÉATION D'UN CONTACT */

  function renderCreateForm() {

    state.creating = true;
    state.selectedId = null;
    state.currentRecord = null;
    state.selectedOrganisationId = null;

    $("searchInput").value = "";
    $("clearSearch").style.display = "none";
    closeResults();

    $("mainContent").innerHTML = `
      <article class="profile">

        <header class="banner">
          <div class="banner-meta"><span>Nouveau contact</span></div>

          <div class="name-fields">
            ${editable("firstName", "", "Prénom", "name-first")}
            ${editable("lastName", "", "Nom", "name-last")}
          </div>

          <div class="role">
            ${editable("role", "", "Fonction / rôle")}
          </div>
        </header>

        <div class="profile-body">

          <section class="organisation-create">
            <label for="organisationSearch">Organisation</label>

            <div class="organisation-search">
              <input id="organisationSearch" type="search" autocomplete="off"
                placeholder="Rechercher une organisation…"
                aria-label="Rechercher une organisation">
              <div id="organisationOptions" class="organisation-options"></div>
            </div>

            <div id="organisationSelected"></div>

            <p class="organisation-help">
              Sélectionnez une organisation existante pour rattacher ce contact à sa fiche.
              Ce champ est facultatif.
            </p>
          </section>

          <section>
            <h2 class="section-title">Coordonnées</h2>
            <div>
              ${contactRow("mail", "Adresse e-mail", "email", "")}
              ${contactRow("phone", "Téléphone", "phone", "")}
              ${contactRow("linkedin", "Profil LinkedIn", "linkedin", "")}
            </div>
          </section>

          <section class="comments-section">
            <h2 class="section-title">Commentaires</h2>
            <textarea class="comments-editor"
              data-field="comments"
              placeholder="Ajouter un commentaire…"></textarea>
          </section>

          <div class="form-actions">
            <button class="btn btn-primary" type="button" data-create>Créer le contact</button>
            <button class="btn btn-secondary" type="button" data-cancel>Annuler</button>
          </div>

          <p class="form-note">
            Entrée passe au champ suivant (Maj+Entrée : retour à la ligne dans les commentaires).
          </p>

        </div>
      </article>`;

    $("status").textContent = "";
    bindCreateEvents();

    /* La liste des organisations se charge en arrière-plan */
    loadOrganisationOptions().then(() => {
      const box = $("organisationSearch");
      if (box && document.activeElement === box) renderOrganisationResults(box.value);
    });
  }

  function bindCreateEvents() {

    const root = $("mainContent");
    const fields = Array.from(root.querySelectorAll("[data-field]"));

    fields.forEach((field, i) => {

      if (field.parentElement.classList.contains("autosize")) {
        field.addEventListener("input", () => {
          field.parentElement.dataset.value = field.value || field.placeholder;
        });
      }

      if (field.dataset.field === "phone") {
        field.addEventListener("blur", () => {
          field.value = formatPhone(field.value);
        });
      }

      field.addEventListener("keydown", e => {
        if (e.key !== "Enter" || e.isComposing) return;
        if (field.tagName === "TEXTAREA" && e.shiftKey) return;

        e.preventDefault();

        if (fields[i + 1]) fields[i + 1].focus();
        else submitNewContact();
      });
    });

    const orgSearch = $("organisationSearch");

    orgSearch.addEventListener("input", () => {
      state.selectedOrganisationId = null;
      renderSelectedOrganisation(null);
      renderOrganisationResults(orgSearch.value);
    });

    orgSearch.addEventListener("focus", () => renderOrganisationResults(orgSearch.value));

    enableListNav(orgSearch, $("organisationOptions"), ".organisation-option");

    root.querySelector("[data-create]").addEventListener("click", submitNewContact);
    root.querySelector("[data-cancel]").addEventListener("click", cancelCreate);

    if (fields[0]) fields[0].focus();
  }

  function cancelCreate() {
    state.creating = false;
    state.selectedOrganisationId = null;
    $("status").textContent = "";
    renderHome();
  }

  async function submitNewContact() {

    const root = $("mainContent");
    const button = root.querySelector("[data-create]");
    const values = {};

    root.querySelectorAll("[data-field]").forEach(f => {
      values[f.dataset.field] = f.value.trim();
    });

    if (!values.firstName && !values.lastName) {
      $("status").textContent = "Renseignez au moins un prénom ou un nom.";
      const first = root.querySelector('[data-field="firstName"]');
      if (first) first.focus();
      return;
    }

    if (values.phone) values.phone = formatPhone(values.phone);

    /* Traduction champ du widget -> colonne Grist associée */
    const fields = {};

    for (const [alias, v] of Object.entries(values)) {
      if (v === "") continue;

      const colId = state.mappings ? state.mappings[alias] : null;
      if (typeof colId === "string" && colId) fields[colId] = v;
    }

    /* Rattachement à l'organisation : vraie référence Grist (identifiant de ligne) */
    if (state.selectedOrganisationId != null) {

      let refCol = state.mappings ? state.mappings.organisationRef : null;

      if (typeof refCol !== "string" || !refCol) {
        refCol = (await detectContactsRef()).colId;
      }

      if (!refCol) {
        $("status").textContent =
          "Impossible de trouver la colonne Référence vers les organisations dans la table Contacts.";
        return;
      }

      fields[refCol] = state.selectedOrganisationId;
    }

    if (button) button.disabled = true;
    $("status").textContent = "Création du contact…";

    try {
      const res = await grist.getTable().create({ fields });

      const created = Array.isArray(res) ? res[0] : res;
      const newId = created && created.id != null ? created.id : null;

      state.creating = false;
      state.selectedOrganisationId = null;
      state.selectedId = newId;

      $("searchInput").value = fullName({
        first: values.firstName || "",
        last: values.lastName || ""
      });
      $("clearSearch").style.display = "block";

      $("status").textContent = "Contact créé.";

      const rec = newId != null
        ? state.contacts.find(r => r.id === newId)
        : null;

      if (rec) {
        renderProfile(rec);
        focusInGrist(newId);
      } else {
        state.pendingCursorId = newId;     // appliqué dès que la ligne est reçue
        renderBlank("Contact créé", "Chargement de la fiche…");
      }

    } catch (err) {
      console.error("Erreur de création Grist :", err);

      $("status").textContent =
        "Création impossible : " +
        (err && err.message ? err.message : "vérifiez les droits et le mapping.");

      if (button) button.disabled = false;
    }
  }

  /* ICÔNES */

  const ICONS = {
    mail: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    phone: '<path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2C10 21 3 14 3 5a2 2 0 0 1 2-2z"/>'
  };

  const LINKEDIN_PATH =
    "M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z";

  function icon(type) {
    if (type === "linkedin") {
      return `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
        <path d="${LINKEDIN_PATH}"/>
      </svg>`;
    }

    return `<svg width="17" height="17" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      ${ICONS[type]}
    </svg>`;
  }

  const COPY_ICON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <rect x="8" y="8" width="13" height="13" rx="2"/>
      <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>
    </svg>`;

  const CHECK_ICON = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m5 12 4 4L19 6"/>
    </svg>`;

  const EXTERNAL_ICON = `
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none"
      stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 3h7v7"/>
      <path d="M10 14 21 3"/>
      <path d="M19 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h6"/>
    </svg>`;

  const EDIT_ICON = `
    <svg width="15" height="15" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 4 4 4"/>
      <path d="M4 20l4-.8L19 8a2.8 2.8 0 0 0-4-4L4 15z"/>
    </svg>`;

  /* CHAMPS MODIFIABLES */

  function editable(alias, value, placeholder, extraClass = "", type = "text") {

    const input = `<input
      class="editable-field ${extraClass}"
      type="${type}"
      data-field="${alias}"
      value="${escapeHtml(value || "")}"
      placeholder="${escapeHtml(placeholder || "Cliquer pour renseigner…")}"
      aria-label="${escapeHtml(placeholder || alias)}">`;

    // Organisation : zone de texte qui passe sur 2 lignes (ou plus) si besoin
    if (extraClass.includes("org-edit")) {
      return `<span class="autogrow"
        data-value="${escapeHtml(value || placeholder || "")}">
        <textarea
          class="editable-field ${extraClass}"
          rows="1"
          data-field="${alias}"
          data-singleline
          placeholder="${escapeHtml(placeholder || "Cliquer pour renseigner…")}"
          aria-label="${escapeHtml(placeholder || alias)}">${escapeHtml(value || "")}</textarea>
      </span>`;
    }

    if (!extraClass.includes("name-")) return input;

    // Prénom / nom : conteneur dont la largeur s'adapte au texte saisi
    return `<span class="autosize ${extraClass.replace("name-", "autosize-")}"
      data-value="${escapeHtml(value || placeholder || "")}">${input}</span>`;
  }

  /* COORDONNÉES */

  function contactRow(type, label, alias, value, copyable = false, href = "") {

    const copy = copyable && value
      ? `<button class="copy-btn" type="button"
          data-copy="${escapeHtml(value)}"
          title="Copier"
          aria-label="Copier ${escapeHtml(label.toLowerCase())}">
          ${COPY_ICON}
        </button>
        <span class="copy-feedback" aria-live="polite"></span>`
      : "";

    const open = href
      ? `<a class="org-open" href="${escapeHtml(href)}"
          target="_blank" rel="noopener noreferrer"
          title="Ouvrir le lien">${EXTERNAL_ICON}</a>`
      : "";

    return `
      <div class="contact-row">
        <div class="contact-icon ${type === "linkedin" ? "li" : ""}">
          ${icon(type)}
        </div>
        <div class="contact-copy">
          <span class="contact-label">${escapeHtml(label)}</span>
          <div class="contact-value-wrap">
            ${editable(alias, value, "Ajouter…")}
            ${copy}
            ${open}
          </div>
        </div>
      </div>`;
  }

  /* LINKEDIN */

  function linkedinDisplay(value) {
    const url = safeUrl(value);

    if (!url) {
      return editable("linkedin", "", "Ajouter un lien LinkedIn…");
    }

    return `
      <div class="linkedin-display">
        <a class="linkedin-link"
          href="${escapeHtml(url)}"
          target="_blank"
          rel="noopener noreferrer">
          Voir le profil LinkedIn ↗
        </a>

        <button class="edit-link-btn"
          type="button"
          data-edit-link="linkedin"
          title="Modifier le lien"
          aria-label="Modifier le lien LinkedIn">
          ${EDIT_ICON}
        </button>
      </div>`;
  }

  function linkedinRow(value) {
    return `
      <div class="contact-row">
        <div class="contact-icon li">${icon("linkedin")}</div>
        <div class="contact-copy">
          <span class="contact-label">Profil LinkedIn</span>

            ${linkedinDisplay(value)}
          </div>
        </div>

  /* SAUVEGARDE GRIST */

  const FIELD_LABELS = {
    firstName: "Prénom",
    lastName: "Nom",
    organisation: "Organisation",
    role: "Fonction / rôle",
    email: "Adresse e-mail",
    phone: "Téléphone",
    linkedin: "Profil LinkedIn",
    active: "Contact actif",
    comments: "Commentaires"
  };

  let saveChain = Promise.resolve();

  /* Les enregistrements sont exécutés l'un après l'autre : aucun n'est perdu
     si on en déclenche un pendant qu'un autre est en cours. */
  function saveField(alias, value) {
    const rec = state.currentRecord;          // fiche concernée au moment de la saisie
    const run = () => writeField(rec, alias, value);
    const result = saveChain.then(run, run);
    saveChain = result.catch(() => {});
    return result;
  }

  async function writeField(rec, alias, value) {

    if (!rec || rec.id == null) return false;

    /* Colonne Grist réellement associée à ce champ du widget */
    const colId = state.mappings ? state.mappings[alias] : null;
    const label = FIELD_LABELS[alias] || alias;

    if (typeof colId !== "string" || !colId) {
      $("status").textContent =
        `Le champ « ${label} » n'est associé à aucune colonne dans les options du widget.`;
      return false;
    }

    $("status").textContent = "Enregistrement…";

    try {
      /* Grist attend { id, fields: { Colonne: valeur } } :
         sans « fields », la requête réussit mais n'écrit rien. */
      await grist.getTable().update([
        { id: rec.id, fields: { [colId]: value } }
      ]);

      $("status").textContent = "Modification enregistrée.";
      return true;

    } catch (err) {
      console.error("Erreur d'enregistrement Grist :", err, { alias, colId });

      const msg = err && err.message ? err.message : "";

      $("status").textContent = /formula column/i.test(msg)
        ? `Modification impossible : le champ « ${label} » est associé à la colonne ` +
          `« ${colId} », qui est une colonne de formule. Associez-le à une colonne ` +
          "de données dans les options du widget."
        : `Enregistrement impossible (champ « ${label} », colonne « ${colId} ») : ` +
          (msg || "vérifiez les droits et le mapping.");
      return false;
    }
  }

  /* COPIE DANS LE PRESSE-PAPIERS */

  async function copyToClipboard(value, button) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
      } else {
        const helper = document.createElement("textarea");
        helper.value = value;
        helper.style.position = "fixed";
        helper.style.opacity = "0";

        document.body.appendChild(helper);
        helper.select();

        const ok = document.execCommand("copy");
        helper.remove();

        if (!ok) throw new Error("Copie non prise en charge par ce navigateur.");
      }

      button.classList.add("copied");
      button.innerHTML = CHECK_ICON;
      button.title = "Copié !";

      const feedback = button.parentElement.querySelector(".copy-feedback");
      if (feedback) feedback.textContent = "Copié !";

      window.setTimeout(() => {
        if (!button.isConnected) return;

        button.classList.remove("copied");
        button.innerHTML = COPY_ICON;
        button.title = "Copier";

        if (feedback) feedback.textContent = "";
      }, 1500);

    } catch (err) {
      $("status").textContent =
        "Impossible de copier : " + (err.message || "erreur du navigateur.");
    }
  }

  /* ÉVÉNEMENTS DE LA FICHE */

  function bindProfileEvents() {

    $("mainContent").querySelectorAll("[data-field]").forEach(field => {

      const commit = () => {
        const alias = field.dataset.field;
        let value = field.value;

        /* Téléphone : le numéro saisi est mis en forme avant enregistrement */
        if (alias === "phone") {
          value = formatPhone(value);
          field.value = value;
        }

        if (field.dataset.lastSaved === value) return;

        field.dataset.lastSaved = value;
        saveField(alias, value);
      };

      field.dataset.lastSaved = field.value;

      field.addEventListener("change", commit);

      /* Prénom / nom : la largeur suit le texte saisi */
      if (field.parentElement.classList.contains("autosize")) {
        field.addEventListener("input", () => {
          field.parentElement.dataset.value = field.value || field.placeholder;
        });
      }

      /* Organisation : la hauteur suit le texte (retours à la ligne ignorés) */
      if (field.parentElement.classList.contains("autogrow")) {
        field.addEventListener("input", () => {
          if (/[\r\n]/.test(field.value)) {
            field.value = field.value.replace(/\s*[\r\n]+\s*/g, " ");
          }
          field.parentElement.dataset.value = field.value || field.placeholder;
        });
      }

      field.addEventListener("keydown", e => {
        if (e.key !== "Enter" || e.isComposing) return;

        const enterSaves = field.hasAttribute("data-enter-saves");

        /* Maj+Entrée : retour à la ligne dans les commentaires */
        if (enterSaves && e.shiftKey) return;

        if (field.tagName === "INPUT" ||
            field.hasAttribute("data-singleline") ||
            enterSaves) {
          e.preventDefault();
          field.blur();          // déclenche l'enregistrement
        }
      });
    });

    /* MODIFICATION DU LIEN LINKEDIN */

    bindLinkedinEditButton();

    /* OUVERTURE DE LA FICHE ORGANISATION */

    $("mainContent").querySelectorAll("[data-open-org]").forEach(b =>
      b.addEventListener("click", () =>
        openOrganisation(
          Number(b.dataset.openOrg) || null,
          b.dataset.orgName || "",
          b.dataset.contactId ? Number(b.dataset.contactId) : null
        ))
    );

    /* BOUTONS DE COPIE */

    $("mainContent").querySelectorAll("[data-copy]").forEach(button => {
      button.addEventListener("click", () =>
        copyToClipboard(button.dataset.copy, button)
      );
    });

    /* STATUT ACTIF / INACTIF */

    const active = $("mainContent").querySelector("[data-active-toggle]");

    if (active) {
      active.addEventListener("click", () => {

        const next = active.dataset.value !== "true";
        const raw = state.currentRecord && state.currentRecord.active;

        let storedValue = next;

        if (typeof raw === "string") {
          const n = normalize(raw);

          if (["oui", "non"].includes(n)) {
            storedValue = next ? "Oui" : "Non";
          } else if (["yes", "no"].includes(n)) {
            storedValue = next ? "Yes" : "No";
          } else if (["actif", "inactive", "active", "inactif"].includes(n)) {
            storedValue = next ? "Actif" : "Inactif";
          }
        }

        saveField("active", storedValue);
      });
    }
  }

  /* LINKEDIN : MODIFICATION PUIS RETOUR À L'AFFICHAGE LOGO + LIEN */

  function bindLinkedinEditButton() {

    const button = $("mainContent").querySelector("[data-edit-link]");

    if (!button) return;

    button.addEventListener("click", () => {

      const wrapper = $("linkedinWrapper");
      const original = state.currentRecord
        ? text(state.currentRecord.linkedin)
        : "";

      wrapper.innerHTML = editable(
        "linkedin",
        original,
        "Ajouter un lien LinkedIn…"
      );

      const field = wrapper.querySelector("[data-field]");
      field.focus();
      field.select();

      let done = false;

      const finish = async (cancel) => {
        if (done) return;
        done = true;

        let value = cancel ? original : field.value.trim();

        if (value !== original) {
          const ok = await saveField("linkedin", value);
          if (!ok) value = original;
        }

        if (!field.isConnected) return;

        /* Retour à l'affichage « logo + lien » */
        wrapper.innerHTML = linkedinDisplay(value);
        bindLinkedinEditButton();

        /* Lien vidé : le champ vide reste modifiable */
        const empty = wrapper.querySelector("[data-field]");
        if (empty) {
          empty.addEventListener("change", () =>
            saveField("linkedin", empty.value.trim())
          );
        }
      };

      /* Quitter le champ (clic ailleurs, Tab…) referme toujours le champ */
      field.addEventListener("blur", () => finish(false));

      field.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          field.blur();
        }
        if (e.key === "Escape") {
          e.preventDefault();
          finish(true);
        }
      });
    });
  }

  /* AFFICHAGE DE LA FICHE */

  /* ORGANISATIONS
     La fiche s'affiche dans ce widget. Il lit la table « Organisation » du document
     (accès complet) et s'adapte à ses colonnes, reconnues d'après leur libellé. */

  const orgState = { tableId: null, cols: [], roles: {}, rows: null, refs: {} };

  const normKey = (v) => normalize(v).replace(/[^a-z0-9]+/g, " ").trim();

  const toRowId = (v) => {
    if (typeof v === "number" && v > 0) return v;
    // formats éventuels : ["R", "Table", 12] ou { id: 12 }
    if (Array.isArray(v)) {
      const ids = v.filter(x => typeof x === "number" && x > 0);
      return ids.length ? ids[0] : null;
    }
    if (v && typeof v === "object" && typeof v.id === "number" && v.id > 0) return v.id;
    return null;
  };

  const ORG_TYPES = ["Start-up", "PME", "Établissement public", "Grand groupe", "Université", "Administration"];

  const formatSiret = (v) => {
    const d = String(v ?? "").replace(/\s/g, "");
    return /^\d{14}$/.test(d)
      ? d.replace(/^(\d{3})(\d{3})(\d{3})(\d{5})$/, "$1 $2 $3 $4")
      : String(v ?? "");
  };

  async function loadOrganisations() {

    const api = grist.docApi;

    const tables = await api.fetchTable("_grist_Tables");
    const names = tables.tableId || [];

    let t = names.findIndex(n => ["organisation", "organisations"].includes(normKey(n)));
    if (t < 0) t = names.findIndex(n => normKey(n).includes("organisation"));
    if (t < 0) throw new Error("Aucune table « Organisation » trouvée dans le document.");

    const tableId = names[t];
    const tableRowId = tables.id[t];

    const meta = await api.fetchTable("_grist_Tables_column");
    const cols = [];

    for (let i = 0; i < meta.id.length; i++) {
      if (meta.parentId[i] !== tableRowId) continue;

      const colId = meta.colId[i];
      if (colId === "manualSort" || String(colId).startsWith("gristHelper_")) continue;

      let opts = {};
      try { opts = JSON.parse(meta.widgetOptions[i] || "{}"); } catch (e) { /* ignoré */ }

      cols.push({
        rowId: meta.id[i],
        colId,
        label: meta.label[i] || colId,
        type: meta.type[i] || "Any",
        isFormula: !!meta.isFormula[i] && !!meta.formula[i],
        choices: Array.isArray(opts.choices) ? opts.choices : [],
        visibleCol: meta.visibleCol ? meta.visibleCol[i] : 0,
        pos: meta.parentPos ? meta.parentPos[i] : i
      });
    }

    cols.sort((a, b) => a.pos - b.pos);

    const rows = await api.fetchTable(tableId);

    /* Colonnes de type Référence : on retrouve le texte affiché */
    const refs = {};

    for (const col of cols) {
      const m = /^Ref(?:List)?:(.+)$/.exec(col.type);
      if (!m) continue;

      try {
        const k = meta.id.indexOf(col.visibleCol);
        const visColId = k >= 0 ? meta.colId[k] : null;
        if (!visColId) continue;

        const target = await api.fetchTable(m[1]);
        const map = new Map();
        target.id.forEach((id, j) => map.set(id, target[visColId][j]));
        refs[col.colId] = map;
      } catch (e) { /* la valeur restera vide */ }
    }

    /* Rôles : on reconnaît les colonnes d'après leur libellé */
    const find = (re, pred = () => true) =>
      cols.find(c => re.test(normKey(c.label)) && pred(c));

    const roles = {};
    roles.id = find(/^(id|identifiant)\b/);
    roles.name = find(/^nom/, c => c.type === "Text")
      || cols.find(c => c.type === "Text" && !c.isFormula && c !== roles.id);
    roles.type = find(/^type/);
    roles.sectors = find(/secteur/);
    roles.city = find(/ville|commune/);
    roles.region = find(/region/);
    roles.country = find(/pays/);
    roles.website = find(/site|web|url/);
    roles.siret = find(/siret/);
    roles.comments = find(/comment|note|remarque/);
    roles.contacts = find(/^contacts?\b/);
    roles.main = find(/principal/, c => c.type.startsWith("Ref:"));

    Object.assign(orgState, { tableId, cols, roles, rows, refs });
  }

  /* Colonne Référence de Contacts vers Organisation : détectée automatiquement
     (si elle n'est pas associée dans les options du widget) */

  const contactsRef = { loaded: false, tableId: null, colId: null };

  async function detectContactsRef() {

    if (contactsRef.loaded) return contactsRef;

    try {
      if (!orgState.tableId) await loadOrganisations();

      const api = grist.docApi;
      const tables = await api.fetchTable("_grist_Tables");
      const meta = await api.fetchTable("_grist_Tables_column");

      const mapped = Object.values(state.mappings || {}).filter(v => typeof v === "string");
      const byTable = new Map();

      for (let i = 0; i < meta.id.length; i++) {
        if (!byTable.has(meta.parentId[i])) byTable.set(meta.parentId[i], []);
        byTable.get(meta.parentId[i]).push({
          colId: meta.colId[i],
          label: meta.label[i] || "",
          type: meta.type[i] || ""
        });
      }

      /* Table des contacts = celle qui contient toutes les colonnes associées au widget */
      for (let t = 0; t < tables.id.length; t++) {
        const cols = byTable.get(tables.id[t]) || [];
        const ids = new Set(cols.map(c => c.colId));

        if (!mapped.length || !mapped.every(m => ids.has(m))) continue;

        const refs = cols.filter(c => c.type === `Ref:${orgState.tableId}`);
        if (!refs.length) continue;

        const pick = refs.find(c => /organisation/.test(normKey(c.label + " " + c.colId))) || refs[0];

        contactsRef.tableId = tables.tableId[t];
        contactsRef.colId = pick.colId;
        break;
      }

      contactsRef.loaded = true;

    } catch (err) {
      console.error("Détection de la colonne Référence :", err);
    }

    return contactsRef;
  }

  /* Identifiant d'organisation de chaque contact : Map(ligne du contact -> ligne de l'organisation) */
  async function detectedOrgIds() {

    const result = new Map();

    try {
      const ref = await detectContactsRef();
      if (!ref.tableId || !ref.colId) return result;

      const data = await grist.docApi.fetchTable(ref.tableId);
      const values = data[ref.colId] || [];

      data.id.forEach((id, i) => {
        const orgId = toRowId(values[i]);
        if (orgId) result.set(id, orgId);
      });
    } catch (err) {
      console.error("Lecture des organisations des contacts :", err);
    }

    return result;
  }

  const canEditOrg = (col) =>
    !col.isFormula && (col.type === "Text" || col.type === "Choice");

  function orgDisplay(col, v) {

    if (v === null || v === undefined || v === "" || v === 0) return "";

    const list = Array.isArray(v) ? (v[0] === "L" ? v.slice(1) : v) : null;
    const lookup = (x) => {
      const m = orgState.refs[col.colId];
      return m && m.has(x) ? text(m.get(x)) : "";
    };

    if (col.type.startsWith("RefList:")) return (list || []).map(lookup).filter(Boolean).join(", ");
    if (col.type.startsWith("Ref:")) return lookup(v);
    if (list) return list.join(", ");
    if (col.type.startsWith("Date") && typeof v === "number") return fmtDate(v);
    if (col.type === "Bool") return v ? "Oui" : "Non";
    if (typeof v === "object") return text(v);

    return String(v);
  }

  function orgFieldHtml(col, shown, editing) {

    const roles = orgState.roles;
    const label = escapeHtml(col.label);

    const isSite = roles.website && roles.website.colId === col.colId;
    const isSiret = roles.siret && roles.siret.colId === col.colId;
    const isType = roles.type && roles.type.colId === col.colId;

    let control;

    if (editing && canEditOrg(col)) {

      if (col.type === "Choice") {

        const choices = col.choices.slice();
        if (shown && !choices.includes(shown)) choices.push(shown);

        control = `<select class="editable-field" data-org-col="${escapeHtml(col.colId)}">
          <option value=""></option>
          ${choices.map(c =>
            `<option value="${escapeHtml(c)}" ${c === shown ? "selected" : ""}>${escapeHtml(c)}</option>`
          ).join("")}
        </select>`;

      } else {

        const value = isSiret ? formatSiret(shown) : shown;

        control = `<input class="editable-field" type="text"
          data-org-col="${escapeHtml(col.colId)}"
          ${isType ? 'list="orgTypes"' : ""}
          value="${escapeHtml(value)}"
          placeholder="Ajouter…">`;
      }

    } else {

      const value = isSiret ? formatSiret(shown) : shown;

      control = isSite && value
        ? `<a class="org-site" href="${escapeHtml(safeUrl(value))}" target="_blank"
            rel="noopener noreferrer">${escapeHtml(value)}</a>`
        : `<div class="org-readonly">${escapeHtml(value) || "—"}</div>`;
    }

    return `
      <div class="org-field">
        <span class="contact-label">${label}</span>
        <div class="contact-value-wrap">${control}</div>
      </div>`;
  }

  function orgMessage(title, msg) {
    $("mainContent").innerHTML = `
      <div class="blank-state">
        <div class="blank-title">${escapeHtml(title)}</div>
        <p class="blank-text">${escapeHtml(msg)}</p>
        <button class="btn btn-secondary" type="button" data-org-back>← Retour</button>
      </div>`;

    $("mainContent").querySelector("[data-org-back]")
      .addEventListener("click", closeOrganisation);
  }

  async function openOrganisation(orgId, name = "", contactId = null) {

    state.view = "org";
    orgState.editing = false;
    $("status").textContent = "";

    renderBlank("Chargement…", "Lecture de la table Organisation.");

    try {
      await loadOrganisations();

      orgState.contactRefs = await detectedOrgIds();

      let id = orgId
        || (contactId != null ? orgState.contactRefs.get(contactId) : null)
        || null;

      /* Pas d'identifiant (colonne Référence non associée) : on cherche par le nom */
      if (!id && name) {
        const col = orgState.roles.name;
        const target = normalize(name);

        if (col) {
          const i = orgState.rows.id.findIndex((_, k) =>
            normalize(orgDisplay(col, orgState.rows[col.colId][k])) === target
          );
          if (i >= 0) id = orgState.rows.id[i];
        }
      }

      if (!id) {
        orgMessage(
          "Organisation introuvable",
          name
            ? `Aucune organisation nommée « ${name} » dans la table Organisation.`
            : "Aucune organisation n'est rattachée à ce contact."
        );
        return;
      }

      renderOrganisation(id);
    } catch (err) {
      console.error("Organisation :", err);
      orgMessage("Organisation indisponible", err && err.message ? err.message : "Lecture impossible.");
    }
  }

  function closeOrganisation() {
    state.view = "contact";

    const rec = state.selectedId != null
      ? state.contacts.find(r => r.id === state.selectedId)
      : null;

    if (rec) renderProfile(rec);
    else renderHome();
  }

  function openContactFromOrg(id) {

    const rec = state.contacts.find(r => r.id === id);
    if (!rec) return;

    state.view = "contact";
    state.selectedId = id;

    $("searchInput").value = fullName(contactData(rec));
    $("clearSearch").style.display = "block";

    focusInGrist(id);
    renderProfile(rec);
  }

  function renderOrganisation(orgId) {

    const { cols, roles, rows } = orgState;
    const idx = rows.id.indexOf(orgId);

    if (idx < 0) {
      orgMessage("Organisation introuvable", "Cette organisation n'existe plus dans la table.");
      return;
    }

    orgState.currentId = orgId;

    const editing = !!orgState.editing;

    const raw = (col) => (col ? rows[col.colId][idx] : undefined);
    const disp = (col) => (col ? orgDisplay(col, raw(col)) : "");

    const tagsOf = (v) =>
      Array.isArray(v) ? (v[0] === "L" ? v.slice(1) : v) : (v ? [String(v)] : []);

    const nameCol = roles.name;
    const name = disp(nameCol);

    const type = disp(roles.type);
    const sectors = roles.sectors ? tagsOf(raw(roles.sectors)) : [];
    const sectorsCol = roles.sectors && roles.sectors.type === "ChoiceList" ? roles.sectors : null;

    /* ----- Informations (le type s'édite ici ; en lecture il est dans la bannière) ----- */
    const infoCols = [
      editing ? roles.type : null,
      roles.website, roles.siret, roles.city, roles.region, roles.country,
      editing && roles.sectors && !sectorsCol ? roles.sectors : null
    ].filter(Boolean);

    const infoHtml = infoCols.length
      ? `<section>
          <h2 class="section-title">Informations</h2>
          <div class="org-grid">${infoCols.map(c => orgFieldHtml(c, disp(c), editing)).join("")}</div>
        </section>`
      : "";

    /* ----- Secteurs d'activité : ajout / retrait (mode modification) ----- */
    let sectorsHtml = "";

    if (editing && sectorsCol) {

      const known = new Set(sectorsCol.choices);
      rows[sectorsCol.colId].forEach(v => tagsOf(v).forEach(t => known.add(t)));

      const suggestions = Array.from(known)
        .filter(t => !sectors.some(s => normalize(s) === normalize(t)))
        .sort((a, b) => normalize(a).localeCompare(normalize(b), "fr"));

      sectorsHtml = `
        <section class="org-section">
          <h2 class="section-title">${escapeHtml(sectorsCol.label)}</h2>

          <div class="tags">
            ${sectors.length
              ? sectors.map((t, i) => `<span class="tag">${escapeHtml(t)}<button class="tag-x"
                  type="button" data-remove-sector="${i}" title="Retirer" aria-label="Retirer ${escapeHtml(t)}">×</button></span>`).join("")
              : `<span class="muted-note">Aucun secteur renseigné.</span>`}
          </div>

          <div class="sector-add">
            <input id="sectorInput" type="text" list="sectorChoices" autocomplete="off"
              placeholder="Ajouter un secteur d'activité…">
            <button class="btn btn-secondary" type="button" data-add-sector>Ajouter</button>
          </div>

          <datalist id="sectorChoices">
            ${suggestions.map(t => `<option value="${escapeHtml(t)}">`).join("")}
          </datalist>
        </section>`;
    }

    /* ----- Contacts rattachés (contact principal en tête, puis ordre alphabétique) ----- */
    const detected = orgState.contactRefs || new Map();
    const idOf = (r) => toRowId(r.organisationRef) || detected.get(r.id) || null;

    const refMapped =
      (state.mappings && typeof state.mappings.organisationRef === "string") ||
      detected.size > 0;

    let linked = sorted().filter(r =>
      refMapped
        ? idOf(r) === orgId
        : name && normalize(text(r.organisation)) === normalize(name)
    );

    const mainId = roles.main ? toRowId(raw(roles.main)) : null;

    if (mainId) {
      linked = [
        ...linked.filter(r => r.id === mainId),
        ...linked.filter(r => r.id !== mainId)
      ];
    }

    const contactItem = (r) => {
      const c = contactData(r);
      const isMain = r.id === mainId;

      const star = editing && roles.main
        ? `<button class="oc-star ${isMain ? "on" : ""}" type="button" data-set-main="${r.id}"
            title="${isMain ? "Retirer le statut de contact principal" : "Définir comme contact principal"}">${STAR_ICON(isMain)}</button>`
        : isMain
          ? `<span class="oc-star on" title="Contact principal">${STAR_ICON(true)}</span>`
          : `<span class="oc-star"></span>`;

      return `<div class="oc-row">
        ${star}
        <button class="oc-open" type="button" data-open-contact="${r.id}">
          <span class="n">${escapeHtml(fullName(c) || "Contact sans nom")}</span>
          ${c.role ? `<span class="r">${escapeHtml(c.role)}</span>` : ""}
        </button>
      </div>`;
    };

    const colA = linked.slice(0, 5).map(contactItem).join("");
    const colB = linked.slice(5).map(contactItem).join("");

    const contactsHtml = `
      <section class="org-section">
        <h2 class="section-title">Contacts rattachés (${linked.length})</h2>
        ${linked.length
          ? `<div class="oc-grid"><div>${colA}</div><div>${colB}</div></div>`
          : `<span class="muted-note">Aucun contact rattaché à cette organisation.</span>`}
        ${editing && !roles.main
          ? `<p class="muted-note" style="margin-top:10px">Pour désigner un contact principal, ajoutez dans la table
              Organisation une colonne Référence « Contact principal » vers Contacts.</p>`
          : ""}
        ${refMapped
          ? ""
          : `<p class="muted-note" style="margin-top:10px">
              Rattachement établi d'après le nom : la colonne Référence vers les organisations
              n'a pas pu être détectée.</p>`}
      </section>`;

    /* ----- Commentaires (tout en bas) ----- */
    const commentsHtml = roles.comments
      ? `<section class="org-section">
          <h2 class="section-title">${escapeHtml(roles.comments.label)}</h2>
          ${editing && canEditOrg(roles.comments)
            ? `<textarea class="comments-editor"
                data-org-col="${escapeHtml(roles.comments.colId)}"
                data-enter-saves
                placeholder="Ajouter un commentaire…">${escapeHtml(disp(roles.comments))}</textarea>`
            : `<div class="org-readonly org-comment">${escapeHtml(disp(roles.comments)) || "—"}</div>`}
        </section>`
      : "";

    /* ----- Bannière : nom, identifiant (minuscule), type, secteurs ----- */
    const titleHtml = editing && nameCol && canEditOrg(nameCol)
      ? `<span class="autogrow" data-value="${escapeHtml(name || "Nom de l'organisation")}">
          <textarea class="editable-field" rows="1" data-singleline
            data-org-col="${escapeHtml(nameCol.colId)}"
            placeholder="Nom de l'organisation">${escapeHtml(name)}</textarea>
        </span>`
      : `<h1 class="org-title">${escapeHtml(name || "Organisation")}</h1>`;

    const badges = [
      type ? `<span class="badge-type">${escapeHtml(type)}</span>` : "",
      ...sectors.map(t => `<span class="badge-sector">${escapeHtml(t)}</span>`)
    ].filter(Boolean).join("");

    $("mainContent").innerHTML = `
      <article class="profile org">

        <header class="banner">

          <div class="banner-meta">
            <button class="back-btn" type="button" data-org-back>← Retour</button>
            <div class="banner-right">
              <span>Fiche organisation</span>
              <button class="edit-toggle ${editing ? "on" : ""}" type="button" data-org-edit
                title="${editing ? "Terminer la modification" : "Modifier l'organisation"}"
                aria-label="${editing ? "Terminer la modification" : "Modifier l'organisation"}">
                ${editing ? CHECK_ICON : EDIT_ICON}
              </button>
            </div>
          </div>

          <div class="org-title-line">${titleHtml}</div>

          ${roles.id ? `<div class="tiny-id">${escapeHtml(disp(roles.id))}</div>` : ""}

          ${badges ? `<div class="org-badges">${badges}</div>` : ""}

        </header>

        <div class="profile-body">
          ${infoHtml}
          ${sectorsHtml}
          ${contactsHtml}
          ${commentsHtml}
        </div>

        <datalist id="orgTypes">
          ${ORG_TYPES.map(t => `<option value="${escapeHtml(t)}">`).join("")}
        </datalist>

      </article>`;

    bindOrgEvents(orgId);
  }

  async function saveOrgField(orgId, colId, value) {

    $("status").textContent = "Enregistrement…";

    try {
      await grist.getTable(orgState.tableId).update([
        { id: orgId, fields: { [colId]: value } }
      ]);

      const i = orgState.rows.id.indexOf(orgId);
      if (i >= 0) orgState.rows[colId][i] = value;

      $("status").textContent = "Modification enregistrée.";
      return true;

    } catch (err) {
      console.error("Erreur d'enregistrement (organisation) :", err);
      const msg = err && err.message ? err.message : "";

      $("status").textContent = /formula column/i.test(msg)
        ? "Modification impossible : cette colonne est une colonne de formule."
        : "Enregistrement impossible : " + (msg || "vérifiez les droits.");
      return false;
    }
  }

  function bindOrgEvents(orgId) {

    const root = $("mainContent");
    const { roles, rows } = orgState;

    root.querySelector("[data-org-back]").addEventListener("click", closeOrganisation);

    /* Crayon : entrer / sortir du mode modification */
    root.querySelector("[data-org-edit]").addEventListener("click", () => {
      orgState.editing = !orgState.editing;
      renderOrganisation(orgId);
    });

    root.querySelectorAll("[data-open-contact]").forEach(b =>
      b.addEventListener("click", () => openContactFromOrg(Number(b.dataset.openContact)))
    );

    /* Contact principal */
    root.querySelectorAll("[data-set-main]").forEach(b =>
      b.addEventListener("click", async () => {

        const id = Number(b.dataset.setMain);
        const col = roles.main;
        const current = toRowId(rows[col.colId][rows.id.indexOf(orgId)]);

        const ok = await saveOrgField(orgId, col.colId, current === id ? 0 : id);
        if (ok) renderOrganisation(orgId);
      })
    );

    /* Secteurs d'activité : ajout / retrait */
    const sCol = roles.sectors && roles.sectors.type === "ChoiceList" ? roles.sectors : null;

    if (orgState.editing && sCol) {

      const currentTags = () => {
        const v = rows[sCol.colId][rows.id.indexOf(orgId)];
        return Array.isArray(v) ? (v[0] === "L" ? v.slice(1) : v) : [];
      };

      const writeTags = async (tags) => {
        const ok = await saveOrgField(orgId, sCol.colId, ["L", ...tags]);
        if (ok) {
          orgState.focusSector = true;
          renderOrganisation(orgId);
        }
      };

      const input = root.querySelector("#sectorInput");

      const addFromInput = () => {
        const t = input.value.trim();
        if (!t) return;

        const tags = currentTags();

        if (tags.some(x => normalize(x) === normalize(t))) {
          input.value = "";
          return;
        }

        writeTags([...tags, t]);
      };

      root.querySelector("[data-add-sector]").addEventListener("click", addFromInput);

      input.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.isComposing) {
          e.preventDefault();
          addFromInput();
        }
      });

      root.querySelectorAll("[data-remove-sector]").forEach(b =>
        b.addEventListener("click", () => {
          const n = Number(b.dataset.removeSector);
          writeTags(currentTags().filter((_, i) => i !== n));
        })
      );

      if (orgState.focusSector) {
        orgState.focusSector = false;
        input.focus();
      }
    }

    /* Champs texte / choix */
    const siretId = roles.siret ? roles.siret.colId : null;

    root.querySelectorAll("[data-org-col]").forEach(field => {

      const colId = field.dataset.orgCol;
      field.dataset.lastSaved = field.value;

      if (field.parentElement.classList.contains("autogrow")) {
        field.addEventListener("input", () => {
          if (/[\r\n]/.test(field.value)) {
            field.value = field.value.replace(/\s*[\r\n]+\s*/g, " ");
          }
          field.parentElement.dataset.value = field.value || field.placeholder;
        });
      }

      field.addEventListener("change", () => {

        let value = field.value.trim();

        if (colId === siretId) {
          const digits = value.replace(/\s/g, "");
          if (/^\d{14}$/.test(digits)) {
            value = digits;
            field.value = formatSiret(digits);
          }
        }

        if (field.dataset.lastSaved === field.value) return;
        field.dataset.lastSaved = field.value;

        saveOrgField(orgId, colId, value);
      });

      field.addEventListener("keydown", e => {
        if (e.key !== "Enter" || e.isComposing) return;

        const enterSaves = field.hasAttribute("data-enter-saves");
        if (enterSaves && e.shiftKey) return;

        if (field.tagName === "INPUT" || field.hasAttribute("data-singleline") || enterSaves) {
          e.preventDefault();
          field.blur();
        }
      });
    });
  }

  /* SÉLECTEUR D'ORGANISATION : liste, recherche, sélection
     (réutilise la détection automatique de la table « Organisation ») */

  async function loadOrganisationOptions() {
    try {
      await loadOrganisations();

      const nameCol = orgState.roles.name;
      if (!nameCol) throw new Error("Colonne du nom de l'organisation introuvable.");

      state.organisations = orgState.rows.id
        .map((id, i) => ({
          id: Number(id),
          name: orgDisplay(nameCol, orgState.rows[nameCol.colId][i]),
          detail: [
            orgState.roles.type ? orgDisplay(orgState.roles.type, orgState.rows[orgState.roles.type.colId][i]) : "",
            orgState.roles.city ? orgDisplay(orgState.roles.city, orgState.rows[orgState.roles.city.colId][i]) : ""
          ].filter(Boolean).join(" · ")
        }))
        .filter(o => Number.isInteger(o.id) && o.id > 0 && o.name)
        .sort((a, b) => normalize(a.name).localeCompare(normalize(b.name), "fr"));

      state.organisationsLoaded = true;
      state.organisationsError = "";

    } catch (err) {
      console.error("Erreur de chargement des organisations :", err);

      state.organisations = [];
      state.organisationsLoaded = false;
      state.organisationsError = err && err.message ? err.message : "Erreur inconnue.";
    }
  }

  function renderOrganisationResults(query = "") {

      box.innerHTML = `
        <div class="organisation-empty">

  const PERSON_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/>
    <path d="M5 20c.6-3.7 3.2-5.6 7-5.6s6.4 1.9 7 5.6"/></svg>`;
