<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiches CORIFER</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bleu:        #1b3f6b;
      --bleu-mid:    #2563a8;
      --bleu-light:  #edf3fb;
      --bleu-border: rgba(37,99,168,.2);
      --bg:          #f0f3f8;
      --surface:     #ffffff;
      --surface-alt: #f7f8fc;
      --border:      #dde2ee;
      --text:        #1a1e2e;
      --text-sec:    #4a5270;
      --text-muted:  #8b93b0;
      --green:       #177a4e;
      --green-bg:    #eaf6f0;
      --red:         #b83030;
      --tag-bg:      #e8f0fb;
      --tag-border:  rgba(37,99,168,.18);
      --tag-text:    #1b4d9a;
      --shadow-sm:   0 1px 3px rgba(20,30,70,.07);
      --shadow:      0 2px 12px rgba(20,30,70,.08), 0 1px 3px rgba(20,30,70,.05);
      --shadow-lg:   0 6px 28px rgba(20,30,70,.11), 0 2px 6px rgba(20,30,70,.06);
      --r:           10px;
      --r-sm:        6px;
      --r-lg:        14px;
      --ease:        .17s cubic-bezier(.4,0,.2,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; line-height: 1.6; height: 100%;
    }

    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 9px 18px; display: flex; align-items: center; gap: 10px;
      flex-shrink: 0; box-shadow: var(--shadow-sm); z-index: 50;
    }
    .brand { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .brand-mark {
      width: 28px; height: 28px; background: var(--bleu);
      border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center;
    }
    .brand-mark svg { width: 15px; height: 15px; fill: white; }
    .brand-name { font-size: 13.5px; font-weight: 700; color: var(--bleu); }
    .sep { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }
    .gap { flex: 1; }

    /* ── PICKER ── */
    .picker { position: relative; flex: 1; max-width: 400px; }
    .picker-btn {
      width: 100%; background: var(--surface-alt); border: 1.5px solid var(--border);
      border-radius: var(--r); padding: 7px 34px 7px 12px; font-family: inherit;
      font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer;
      text-align: left; display: flex; align-items: center; gap: 8px; outline: none;
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    .picker-btn:hover { border-color: var(--bleu-mid); }
    .picker-btn.open {
      border-color: var(--bleu-mid); box-shadow: 0 0 0 3px rgba(37,99,168,.11);
      border-radius: var(--r) var(--r) 0 0; border-bottom-color: transparent;
    }
    .picker-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-count {
      background: var(--bleu); color: white; font-size: 10px; font-weight: 700;
      border-radius: 20px; padding: 1px 7px; flex-shrink: 0;
    }
    .picker-chevron {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none; transition: transform var(--ease);
    }
    .picker-btn.open ~ .picker-chevron { transform: translateY(-50%) rotate(180deg); }
    .picker-drop {
      display: none; position: absolute; top: 100%; left: 0; right: 0;
      background: var(--surface); border: 1.5px solid var(--bleu-mid);
      border-top: none; border-radius: 0 0 var(--r) var(--r);
      box-shadow: var(--shadow-lg); z-index: 999;
      flex-direction: column; max-height: 320px; overflow: hidden;
    }
    .picker.open .picker-drop { display: flex; }
    .picker-search-wrap { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .picker-search {
      width: 100%; border: 1.5px solid var(--border); border-radius: var(--r-sm);
      padding: 6px 10px; font-family: inherit; font-size: 13px; color: var(--text);
      background: var(--bg); outline: none; transition: border-color var(--ease);
    }
    .picker-search:focus { border-color: var(--bleu-mid); }
    .picker-list { overflow-y: auto; flex: 1; }
    .picker-item {
      padding: 9px 14px; display: flex; align-items: center; gap: 10px;
      cursor: pointer; border-bottom: 1px solid var(--border);
      transition: background var(--ease); font-size: 13px;
    }
    .picker-item:last-child { border-bottom: none; }
    .picker-item:hover { background: var(--bleu-light); }
    .picker-item.active { background: var(--bleu-light); font-weight: 600; color: var(--bleu-mid); }
    .picker-item-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
    .picker-item.active .picker-item-dot { background: var(--bleu-mid); }
    .picker-item-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .picker-item-op { font-size: 11px; color: var(--text-muted); }

    /* ── SAVE ── */
    .save-ind {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--text-muted); flex-shrink: 0;
      transition: color var(--ease);
    }
    .save-ind.saving { color: #b07a00; }
    .save-ind.saved  { color: var(--green); }
    .save-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px; padding: 7px 12px;
      border-radius: var(--r-sm); font-family: inherit; font-size: 12.5px; font-weight: 500;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all var(--ease); white-space: nowrap; flex-shrink: 0;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn-ghost { background: transparent; border-color: var(--border); color: var(--text-sec); }
    .btn-ghost:hover { border-color: var(--bleu-mid); color: var(--bleu-mid); background: var(--bleu-light); }
    .btn-solid { background: var(--bleu); color: white; border-color: var(--bleu); }
    .btn-solid:hover { background: var(--bleu-mid); border-color: var(--bleu-mid); }

    /* ── MAIN ── */
    .main { flex: 1; overflow-y: auto; padding: 24px 20px 48px; }
    .empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 10px; color: var(--text-muted);
    }
    .empty svg { width: 46px; height: 46px; opacity: .2; }
    .empty p { font-size: 14px; opacity: .5; }

    /* ── FICHE ── */
    .fiche { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    /* ── BANNIÈRE ── */
    .banner {
      background: linear-gradient(130deg, var(--bleu) 0%, #1f4e8a 100%);
      border-radius: var(--r-lg); padding: 22px 26px 20px;
      color: white; box-shadow: var(--shadow); position: relative; overflow: hidden;
    }
    .banner::before {
      content: ''; position: absolute; top: -50px; right: -40px;
      width: 180px; height: 180px; background: rgba(255,255,255,.04); border-radius: 50%;
    }
    .banner-top {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px; margin-bottom: 16px;
    }
    .banner-name { font-size: 21px; font-weight: 700; letter-spacing: -.2px; line-height: 1.25; }
    .banner-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .banner-op-hint { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; opacity: .55; font-weight: 500; }
    .banner-op-pill {
      font-size: 12.5px; font-weight: 600; background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22); border-radius: 20px; padding: 3px 11px;
    }
    .banner-meta { display: flex; flex-wrap: wrap; gap: 18px; position: relative; z-index: 1; }
    .banner-meta-item { display: flex; flex-direction: column; gap: 2px; }
    .banner-meta-hint { font-size: 10px; text-transform: uppercase; letter-spacing: .7px; opacity: .5; font-weight: 500; }
    .banner-meta-val { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .banner-meta-val svg { width: 12px; height: 12px; opacity: .65; }
    .badge-tenue {
      display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px;
      border-radius: 20px; font-size: 11.5px; font-weight: 600;
    }
    .badge-tenue.ok  { background: rgba(23,122,78,.2);  color: #9ff5c8; }
    .badge-tenue.nok { background: rgba(184,48,48,.2);  color: #ffb3b3; }
    .badge-tenue-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .dossier-btn {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; background: rgba(255,255,255,.14);
      border: 1px solid rgba(255,255,255,.22); border-radius: var(--r-sm);
      color: white; text-decoration: none; transition: background var(--ease);
    }
    .dossier-btn:hover { background: rgba(255,255,255,.26); }
    .dossier-btn svg { width: 13px; height: 13px; }

    /* ── SECTION ── */
    .section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden;
    }
    .section-head {
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      background: var(--surface-alt); display: flex; align-items: center; gap: 9px;
    }
    .section-icon {
      width: 25px; height: 25px; border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .section-icon svg { width: 13px; height: 13px; }
    .section-title { font-size: 12px; font-weight: 600; color: var(--bleu); text-transform: uppercase; letter-spacing: .65px; }
    .section-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

    /* ── GRILLE ── */
    .row   { display: grid; gap: 13px; }
    .row-2 { grid-template-columns: 1fr 1fr; }
    .full  { grid-column: 1/-1; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .65px; color: var(--text-muted);
    }

    /* ── INPUTS ── */
    .inp {
      background: var(--surface-alt); border: 1.5px solid var(--border);
      border-radius: var(--r-sm); padding: 7px 10px; font-family: inherit;
      font-size: 13.5px; color: var(--text); width: 100%; outline: none; resize: none;
      transition: border-color var(--ease), background var(--ease), box-shadow var(--ease);
    }
    .inp:hover { border-color: #b8c0d8; background: white; }
    .inp:focus { border-color: var(--bleu-mid); background: white; box-shadow: 0 0 0 3px rgba(37,99,168,.1); }
    textarea.inp { min-height: 90px; line-height: 1.65; }
    textarea.inp.tall { min-height: 130px; }

    /* ── MONTANTS ── */
    .montant-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
    .montant-card {
      background: var(--surface-alt); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 14px;
    }
    .montant-card.hi { background: var(--bleu-light); border-color: var(--bleu-border); }
    .montant-card-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .6px; color: var(--text-muted); margin-bottom: 5px;
    }
    .montant-card.hi .montant-card-label { color: var(--bleu-mid); }
    .montant-row { display: flex; align-items: baseline; gap: 4px; }
    .montant-inp {
      flex: 1; border: none; background: transparent; outline: none;
      font-family: inherit; font-size: 18px; font-weight: 700; color: var(--text);
      padding: 0; min-width: 0;
    }
    .montant-card.hi .montant-inp { color: var(--bleu); }
    .montant-inp:focus { color: var(--bleu-mid); }
    .montant-unit { font-size: 12px; color: var(--text-muted); }
    .montant-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }

    /* ── CHOICE LIST ── */
    .cl-field { display: flex; flex-direction: column; gap: 6px; }

    .cl-tags {
      display: flex; flex-wrap: wrap; gap: 5px; min-height: 28px;
    }
    .cl-empty-hint { font-size: 12px; color: var(--text-muted); font-style: italic; }

    .cl-tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--tag-bg); border: 1px solid var(--tag-border);
      color: var(--tag-text); border-radius: 20px;
      padding: 2px 10px; font-size: 12px; font-weight: 500;
    }
    .cl-tag-x {
      cursor: pointer; opacity: .45; font-size: 15px; line-height: 1;
      transition: opacity var(--ease); margin-left: 2px;
    }
    .cl-tag-x:hover { opacity: 1; }

    /* Champ de saisie pour ajouter */
    .cl-input-wrap { position: relative; }
    .cl-inp {
      width: 100%; background: var(--surface-alt); border: 1.5px solid var(--border);
      border-radius: var(--r-sm); padding: 7px 10px; font-family: inherit;
      font-size: 13px; color: var(--text); outline: none;
      transition: border-color var(--ease), box-shadow var(--ease), background var(--ease);
    }
    .cl-inp:focus { border-color: var(--bleu-mid); box-shadow: 0 0 0 3px rgba(37,99,168,.09); background: white; }
    .cl-inp::placeholder { color: var(--text-muted); }

    /* Dropdown suggestions */
    .cl-drop {
      display: none; position: absolute; top: calc(100% + 3px); left: 0; right: 0;
      background: var(--surface); border: 1.5px solid var(--bleu-mid);
      border-radius: var(--r-sm); box-shadow: var(--shadow-lg);
      z-index: 300; max-height: 200px; overflow-y: auto;
    }
    .cl-drop.show { display: block; }
    .cl-drop-item {
      padding: 8px 12px; cursor: pointer; font-size: 13px; color: var(--text);
      border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
      transition: background var(--ease);
    }
    .cl-drop-item:last-child { border-bottom: none; }
    .cl-drop-item:hover { background: var(--bleu-light); }
    .cl-drop-item.already { opacity: .4; cursor: default; pointer-events: none; }
    .cl-drop-item-new {
      font-style: italic; color: var(--bleu-mid);
    }
    .cl-drop-empty { padding: 10px 12px; font-size: 12px; color: var(--text-muted); text-align: center; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 16px; right: 16px; padding: 9px 15px;
      border-radius: var(--r); font-size: 13px; font-weight: 500; color: white;
      background: var(--bleu); box-shadow: var(--shadow-lg); z-index: 9999;
      opacity: 0; transform: translateY(8px); transition: all var(--ease); pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok  { background: var(--green); }
    .toast.err { background: var(--red); }

    /* ── PRINT ── */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body { background: white; font-size: 10.5pt; }
      .app { height: auto; overflow: visible; }
      .topbar, .no-print { display: none !important; }
      .main { overflow: visible; padding: 0; }
      .fiche { max-width: 100%; gap: 12pt; }
      .banner { background: var(--bleu) !important; border-radius: 7pt; padding: 14pt 18pt; }
      .section { break-inside: avoid; box-shadow: none; border: .75pt solid #d0d4e4; }
      .section-head { background: #f7f8fc !important; }
      .inp { border: none; background: transparent; padding: 0; resize: none; overflow: visible; height: auto; }
      textarea.inp { min-height: 0; }
      .cl-input-wrap { display: none; }
      .cl-tags { flex-wrap: wrap; }
      .montant-inp { font-size: 14pt; }
      .montant-card { border: .75pt solid #d0d4e4; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #b0b8d0; }
  </style>
</head>
<body>
<div class="app">

  <!-- ══ TOPBAR ══ -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24"><path d="M20 6H4V4h16v2zm-2 4H6V8h12v2zm2 4H4v-2h16v2zm-2 4H6v-2h12v2z"/></svg>
      </div>
      <span class="brand-name">CORIFER</span>
    </div>
    <div class="sep"></div>

    <!-- Sélecteur -->
    <div class="picker no-print" id="picker">
      <button class="picker-btn" id="pickerBtn" onclick="togglePicker()">
        <span class="picker-label" id="pickerLabel">Sélectionner un projet…</span>
        <span class="picker-count" id="pickerCount">0</span>
      </button>
      <svg class="picker-chevron" viewBox="0 0 24 24" width="16" height="16"
           fill="none" stroke="currentColor" stroke-width="2.2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
      <div class="picker-drop" id="pickerDrop">
        <div class="picker-search-wrap">
          <input class="picker-search" id="pickerSearch" type="text"
                 placeholder="Rechercher…" oninput="filterPicker(this.value)"/>
        </div>
        <div class="picker-list" id="pickerList"></div>
      </div>
    </div>

    <div class="gap"></div>

    <div class="save-ind no-print" id="saveInd">
      <span class="save-dot"></span>
      <span id="saveTxt">Synchronisé</span>
    </div>

    <button class="btn btn-ghost no-print" onclick="window.print()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 6 2 18 2 18 9"/>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
        <rect x="6" y="14" width="12" height="8"/>
      </svg>
      PDF
    </button>
    <button class="btn btn-solid no-print" onclick="exportDocx()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
      </svg>
      DOCX
    </button>
  </header>

  <!-- ══ MAIN ══ -->
  <main class="main">
    <div class="empty" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <p>Sélectionnez un projet pour afficher sa fiche</p>
    </div>

    <div class="fiche" id="fiche" style="display:none;">

      <!-- BANNIÈRE -->
      <div class="banner">
        <div class="banner-top">
          <div class="banner-name" id="bName">—</div>
          <div class="banner-right">
            <span class="banner-op-hint">Opérateur</span>
            <span class="banner-op-pill" id="bOp">—</span>
          </div>
        </div>
        <div class="banner-meta">
          <div class="banner-meta-item">
            <span class="banner-meta-hint">Audition</span>
            <span class="banner-meta-val" id="bDate">—</span>
          </div>
          <div class="banner-meta-item">
            <span class="banner-meta-hint">Horaires</span>
            <span class="banner-meta-val" id="bHoraires">—</span>
          </div>
          <div class="banner-meta-item">
            <span class="banner-meta-hint">Tenue</span>
            <span class="banner-meta-val" id="bTenue">—</span>
          </div>
          <div class="banner-meta-item">
            <span class="banner-meta-hint">Dossier partagé</span>
            <span class="banner-meta-val">
              <a id="bLien" href="#" target="_blank" class="dossier-btn" title="Ouvrir">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                </svg>
              </a>
            </span>
          </div>
        </div>
      </div>

      <!-- SECTION 1 — Généralités -->
      <div class="section">
        <div class="section-head">
          <div class="section-icon" style="background:#edf3fb;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#2563a8" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
          </div>
          <span class="section-title">Informations générales</span>
        </div>
        <div class="section-body">
          <div class="row row-2">
            <div class="field">
              <label class="field-label">Chef de file</label>
              <input class="inp" id="f_chef" type="text"
                     data-col="ChefDeFile" oninput="onChange(this)"/>
            </div>
            <div class="field">
              <label class="field-label">Membres du consortium</label>
              <div class="cl-field" id="cl_consortium" data-col="Consortium"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- SECTION 2 — Participants -->
      <div class="section">

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════
   COLUMN MAPPING — Grist affiche un panneau de
   configuration où l'utilisateur associe chaque champ
   du widget à la vraie colonne de sa table.
═══════════════════════════════════════════════════════ */
grist.ready({
  requiredAccess: 'full',
  columns: [
    { name: 'Projet',           title: 'Titre du projet',               type: 'Text',       optional: false },
    { name: 'Operateur',        title: 'Opérateur',                     type: 'Text',       optional: true  },
    { name: 'ChefDeFile',       title: 'Chef de file',                  type: 'Text',       optional: true  },
    { name: 'Consortium',       title: 'Membres du consortium',         type: 'ChoiceList', optional: true  },
    { name: 'Lien',             title: 'Lien vers le dossier partagé',  type: 'Text',       optional: true  },
    { name: 'Debut',            title: 'Date de début',                 type: 'DateTime',   optional: true  },
    { name: 'Horaires',         title: 'Horaires (affichage)',          type: 'Text',       optional: true  },
    { name: 'Tenue',            title: "Tenue de l'audition",           type: 'Bool',       optional: true  },
    { name: 'ParticipantsSPIN', title: 'Participants SPIN',             type: 'ChoiceList', optional: true  },
    { name: 'ParticipationEtat',title: 'Participation État',            type: 'ChoiceList', optional: true  },
    { name: 'HorsSPIN',         title: 'Participants hors SPIN',        type: 'ChoiceList', optional: true  },
    { name: 'MontantProjet',    title: 'Montant total du projet (€)',   type: 'Numeric',    optional: true  },
    { name: 'MontantAide',      title: "Montant total d'aide (€)",      type: 'Numeric',    optional: true  },
    { name: 'Subventions',      title: 'Subventions (€)',               type: 'Numeric',    optional: true  },
    { name: 'AR',               title: 'AR (€)',                        type: 'Numeric',    optional: true  },
    { name: 'Presentation',     title: 'Présentation du projet',        type: 'Text',       optional: true  },
    { name: 'Objectifs',        title: 'Objectifs du projet',           type: 'Text',       optional: true  },
    { name: 'Avancement',       title: 'Avancement du projet',          type: 'Text',       optional: true  },
    { name: 'Freins',           title: 'Freins rencontrés',             type: 'Text',       optional: true  },
    { name: 'Potentiel',        title: "Potentiel de l'innovation",     type: 'Text',       optional: true  },
    { name: 'Perspectives',     title: 'Perspectives de développement', type: 'Text',       optional: true  },
    { name: 'AvisSPIN',         title: 'Avis SPIN',                     type: 'Text',       optional: true  },
    { name: 'AvisSFG',          title: 'Avis SFG',                      type: 'Text',       optional: true  },
  ]
});

/* ═══════════════════════════════════════════════════════
   ÉTAT GLOBAL
═══════════════════════════════════════════════════════ */
let allRecords    = [];   // tous les enregistrements mappés
let currentRowId  = null; // id de la ligne sélectionnée
let currentMaps   = null; // mappings widgetCol → realCol
let tableId       = null; // id de la table pour l'API metadata
let pending       = {};   // modifications en attente
let saveTimer     = null;
let isSaving      = false;

// Cache des choix existants par colonne widgetName
// { Consortium: Set(['val1','val2',...]), ... }
const choiceCache = {};

/* ═══════════════════════════════════════════════════════
   RÉCEPTION DES DONNÉES
═══════════════════════════════════════════════════════ */
grist.onRecords(function(records, mappings) {
  currentMaps = mappings;
  allRecords  = records.map(r => {
    const m = grist.mapColumnNames(r, mappings) || {};
    m.__id  = r.id;
    m.__raw = r;
    return m;
  });

  // Récupère l'id de la table pour l'API metadata
  if (records.length && !tableId) {
    grist.selectedTable.getTableId().then(id => {
      tableId = id;
      // Précharge les choix existants pour toutes les ChoiceList
      preloadAllChoices();
    }).catch(() => {});
  }

  document.getElementById('pickerCount').textContent =
    allRecords.filter(r => r && r.Projet).length;
  buildPicker();

  if (currentRowId !== null) {
    const rec = allRecords.find(r => r.__id === currentRowId);
    if (rec) fillFiche(rec);
  }
});

grist.onRecord(function(record, mappings) {
  if (!record) return;
  currentMaps  = mappings;
  const mapped = grist.mapColumnNames(record, mappings);
  if (!mapped) return;
  mapped.__id  = record.id;
  mapped.__raw = record;
  currentRowId = record.id;
  highlightPicker(record.id);
  fillFiche(mapped);
});

/* ═══════════════════════════════════════════════════════
   PRÉCHARGEMENT DES CHOIX EXISTANTS
   Lit les métadonnées Grist pour récupérer la liste
   officielle des choix de chaque colonne ChoiceList,
   et les enrichit avec les valeurs déjà présentes
   dans les enregistrements.
═══════════════════════════════════════════════════════ */
const CL_COLS = ['Consortium','ParticipantsSPIN','ParticipationEtat','HorsSPIN'];

async function preloadAllChoices() {
  for (const widgetCol of CL_COLS) {
    if (!choiceCache[widgetCol]) choiceCache[widgetCol] = new Set();

    // 1. Extrait les valeurs déjà présentes dans les enregistrements
    allRecords.forEach(r => {
      const rawVal = r.__raw ? r.__raw[currentMaps?.[widgetCol]] : null;
      decodeChoiceList(rawVal).forEach(v => choiceCache[widgetCol].add(v));
    });

    // 2. Tente de lire la liste officielle via les métadonnées Grist
    try {
      const realCol = currentMaps?.[widgetCol];
      if (realCol && tableId) {
        const colsMeta = await grist.docApi.fetchTable('_grist_Tables_column');
        // Trouve la colonne par tableRef et colId
        const tablesMeta = await grist.docApi.fetchTable('_grist_Tables');
        const tIdx = tablesMeta.tableId.findIndex(t => t === tableId);
        if (tIdx !== -1) {
          const tableRef = tablesMeta.id[tIdx];
          const colIdx   = colsMeta.colId.findIndex(
            (c, i) => c === realCol && colsMeta.parentId[i] === tableRef
          );
          if (colIdx !== -1) {
            const widgetOpts = colsMeta.widgetOptions[colIdx];
            if (widgetOpts) {
              try {
                const opts = JSON.parse(widgetOpts);
                if (opts.choices && Array.isArray(opts.choices)) {
                  opts.choices.forEach(c => choiceCache[widgetCol].add(c));
                }
              } catch(e) {}
            }
          }
        }
      }
    } catch(e) {
      // Silencieux : on travaille avec les valeurs extraites des enregistrements
    }
  }
}

/* ═══════════════════════════════════════════════════════
   AJOUT D'UN CHOIX À LA LISTE OFFICIELLE GRIST
   Évite le surlignage rouge dans le tableau.
═══════════════════════════════════════════════════════ */
async function addChoiceToColumn(widgetCol, newValue) {
  // Déjà dans le cache → rien à faire
  if (choiceCache[widgetCol]?.has(newValue)) return;

  try {
    const realCol = currentMaps?.[widgetCol];
    if (!realCol || !tableId) return;

    // Récupère les métadonnées de la colonne
    const colsMeta   = await grist.docApi.fetchTable('_grist_Tables_column');
    const tablesMeta = await grist.docApi.fetchTable('_grist_Tables');
    const tIdx = tablesMeta.tableId.findIndex(t => t === tableId);
    if (tIdx === -1) return;

    const tableRef = tablesMeta.id[tIdx];
    const colIdx   = colsMeta.colId.findIndex(
      (c, i) => c === realCol && colsMeta.parentId[i] === tableRef
    );
    if (colIdx === -1) return;

    const colRef    = colsMeta.id[colIdx];
    const widgetOpts = colsMeta.widgetOptions[colIdx];
    let opts = {};
    try { opts = JSON.parse(widgetOpts || '{}'); } catch(e) {}

    const existingChoices = Array.isArray(opts.choices) ? opts.choices : [];
    if (existingChoices.includes(newValue)) {
      choiceCache[widgetCol].add(newValue);
      return;
    }

    // Ajoute le nouveau choix
    const newChoices = [...existingChoices, newValue];
    opts.choices = newChoices;

    // Met à jour les métadonnées via l'API Grist
    await grist.docApi.applyUserActions([
      ['UpdateRecord', '_grist_Tables_column', colRef, {
        widgetOptions: JSON.stringify(opts)
      }]
    ]);

    // Met à jour le cache local
    if (!choiceCache[widgetCol]) choiceCache[widgetCol] = new Set();
    choiceCache[widgetCol].add(newValue);

  } catch(e) {
    console.warn('Impossible d\'ajouter le choix à la liste officielle :', e);
    // On continue quand même — la valeur sera sauvegardée, juste en rouge dans Grist
  }
}

/* ═══════════════════════════════════════════════════════
   ENCODE / DÉCODE CHOICELIST
═══════════════════════════════════════════════════════ */
function decodeChoiceList(val) {
  if (Array.isArray(val) && val[0] === 'L') return val.slice(1);
  if (typeof val === 'string' && val.trim())
    return val.split(';').map(s => s.trim()).filter(Boolean);
  return [];
}

function encodeChoiceList(arr) {
  return ['L', ...arr];
}

/* ═══════════════════════════════════════════════════════
   SÉLECTEUR DE FICHE
═══════════════════════════════════════════════════════ */
function buildPicker() {
  const list  = document.getElementById('pickerList');
  const items = allRecords.filter(r => r && r.Projet);
  list.innerHTML = items.map(r => `
    <div class="picker-item ${r.__id === currentRowId ? 'active' : ''}"
         data-id="${r.__id}" onclick="selectRow(${r.__id})">
      <div class="picker-item-dot"></div>
      <span class="picker-item-name">${esc(r.Projet)}</span>
      <span class="picker-item-op">${esc(r.Operateur || '')}</span>
    </div>`).join('');
}

function filterPicker(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.picker-item').forEach(el => {
    el.style.display =
      el.querySelector('.picker-item-name').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function togglePicker() {
  const p   = document.getElementById('picker');
  const btn = document.getElementById('pickerBtn');
  const open = p.classList.toggle('open');
  btn.classList.toggle('open', open);
  if (open) setTimeout(() => document.getElementById('pickerSearch').focus(), 40);
}

document.addEventListener('click', e => {
  const p = document.getElementById('picker');
  if (!p.contains(e.target)) {
    p.classList.remove('open');
    document.getElementById('pickerBtn').classList.remove('open');
  }
});

function selectRow(rowId) {
  currentRowId = rowId;
  document.getElementById('picker').classList.remove('open');
  document.getElementById('pickerBtn').classList.remove('open');
  highlightPicker(rowId);
  const rec = allRecords.find(r => r.__id === rowId);
  if (rec) {
    document.getElementById('pickerLabel').textContent = rec.Projet || '—';
    fillFiche(rec);
    grist.setCursorPos({ rowId }).catch(() => {});
  }
}

function highlightPicker(rowId) {
  document.querySelectorAll('.picker-item').forEach(el =>
    el.classList.toggle('active', parseInt(el.dataset.id) === rowId));
  const rec = allRecords.find(r => r.__id === rowId);
  if (rec) document.getElementById('pickerLabel').textContent = rec.Projet || '—';
}

/* ═══════════════════════════════════════════════════════
   REMPLISSAGE DE LA FICHE
═══════════════════════════════════════════════════════ */
function fillFiche(r) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('fiche').style.display      = 'flex';

  // Bannière
  document.getElementById('bName').textContent = r.Projet    || '—';
  document.getElementById('bOp').textContent   = r.Operateur || '—';

  document.getElementById('bDate').innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
       <rect x="3" y="4" width="18" height="18" rx="2"/>
       <line x1="16" y1="2" x2="16" y2="6"/>
       <line x1="8" y1="2" x2="8" y2="6"/>
       <line x1="3" y1="10" x2="21" y2="10"/>
     </svg>${fmtDate(r.Debut)}`;

  document.getElementById('bHoraires').innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12">
       <circle cx="12" cy="12" r="10"/>
       <polyline points="12 6 12 12 16 14"/>
     </svg>${esc(r.Horaires || '—')}`;

  const tenue = !!r.Tenue;
  document.getElementById('bTenue').innerHTML =
    `<span class="badge-tenue ${tenue ? 'ok' : 'nok'}">
       <span class="badge-tenue-dot"></span>${tenue ? 'Tenue' : 'Non tenue'}
     </span>`;

  const lien = r.Lien || '';
  const lienEl = document.getElementById('bLien');
  lienEl.href  = lien || '#';
  lienEl.style.opacity       = lien ? '1' : '.3';
  lienEl.style.pointerEvents = lien ? '' : 'none';

  // Texte simple
  sv('f_chef', r.ChefDeFile);

  // Choice lists — on passe la valeur brute de l'enregistrement
  renderCL('cl_consortium', r.__raw, 'Consortium');
  renderCL('cl_spin',       r.__raw, 'ParticipantsSPIN');
  renderCL('cl_etat',       r.__raw, 'ParticipationEtat');
  renderCL('cl_horsspin',   r.__raw, 'HorsSPIN');

  // Montants
  setMontant('f_mProjet', r.MontantProjet);
  setMontant('f_mAide',   r.MontantAide);
  setMontant('f_subv',    r.Subventions);
  setMontant('f_ar',      r.AR);

  // Textareas
  sta('f_pres',         r.Presentation);
  sta('f_obj',          r.Objectifs);
  sta('f_av',           r.Avancement);
  sta('f_freins',       r.Freins);
  sta('f_potentiel',    r.Potentiel);
  sta('f_perspectives', r.Perspectives);
  sta('f_avisSpin',     r.AvisSPIN);
  sta('f_avisSfg',      r.AvisSFG);

  pending = {};
}

/* ═══════════════════════════════════════════════════════
   CHOICE LIST — RENDU
═══════════════════════════════════════════════════════ */
function renderCL(containerId, rawRecord, widgetCol) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const realCol = currentMaps?.[widgetCol];
  const rawVal  = realCol && rawRecord ? rawRecord[realCol] : null;
  const selected = decodeChoiceList(rawVal);

  container.innerHTML = '';
  container.dataset.widgetCol = widgetCol;
  container.dataset.selected  = JSON.stringify(selected);

  // ── Zone de tags ──
  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'cl-tags';
  tagsDiv.id = containerId + '_tags';
  container.appendChild(tagsDiv);
  renderCLTags(containerId, selected);

  // ── Zone de saisie ──
  const wrap = document.createElement('div');
  wrap.className = 'cl-input-wrap';

  const inp = document.createElement('input');
  inp.className   = 'cl-inp';
  inp.type        = 'text';
  inp.placeholder = 'Ajouter…';
  inp.setAttribute('autocomplete', 'off');

  const drop = document.createElement('div');
  drop.className = 'cl-drop';

  wrap.appendChild(inp);
  wrap.appendChild(drop);
  container.appendChild(wrap);

  // Événements
  inp.addEventListener('focus', () => refreshDrop(containerId, widgetCol, inp, drop));
  inp.addEventListener('input', () => refreshDrop(containerId, widgetCol, inp, drop));

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && inp.value.trim()) {
      e.preventDefault();
      confirmAdd(containerId, widgetCol, inp.value.trim(), inp, drop);
    }
    if (e.key === 'Escape') { drop.classList.remove('show'); inp.blur(); }
  });

  // Ferme le dropdown si clic ailleurs
  document.addEventListener('click', e => {
    if (!wrap.contains(e.target)) drop.classList.remove('show');
  }, true);
}

function renderCLTags(containerId, selected) {
  const tagsDiv = document.getElementById(containerId + '_tags');
  if (!tagsDiv) return;
  tagsDiv.innerHTML = '';
  if (selected.length === 0) {
    const hint = document.createElement('span');
    hint.className = 'cl-empty-hint';
    hint.textContent = 'Aucun élément';
    tagsDiv.appendChild(hint);
    return;
  }
  selected.forEach(val => {
    const tag = document.createElement('span');
    tag.className = 'cl-tag';
    tag.innerHTML = `${esc(val)}<span class="cl-tag-x">×</span>`;
    tag.querySelector('.cl-tag-x').onclick = () => removeCLItem(containerId, val);
    tagsDiv.appendChild(tag);
  });
}

function refreshDrop(containerId, widgetCol, inp, drop) {
  const container = document.getElementById(containerId);
  const current   = JSON.parse(container.dataset.selected || '[]');
  const q         = inp.value.trim().toLowerCase();

  // Suggestions : toutes les valeurs du cache, filtrées
  const cache    = choiceCache[widgetCol] || new Set();
  let suggestions = [...cache].filter(v => !current.includes(v));
  if (q) suggestions = suggestions.filter(v => v.toLowerCase().includes(q));

  drop.innerHTML = '';

  // Option "Ajouter X" si valeur tapée et pas déjà dans le cache
  if (q && ![...cache].some(v => v.toLowerCase() === q)) {
    const item = document.createElement('div');
    item.className = 'cl-drop-item cl-drop-item-new';
    item.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Ajouter « ${esc(inp.value.trim())} »`;
    item.onclick = () => confirmAdd(containerId, widgetCol, inp.value.trim(), inp, drop);
    drop.appendChild(item);
  }

  if (suggestions.length === 0 && !q) {
    const empty = document.createElement('div');
    empty.className = 'cl-drop-empty';
    empty.textContent = 'Tapez pour ajouter un élément…';
    drop.appendChild(empty);
  } else {
    suggestions.forEach(v => {
      const item = document.createElement('div');
      item.className = 'cl-drop-item';
      item.textContent = v;
      item.onclick = () => confirmAdd(containerId, widgetCol, v, inp, drop);
      drop.appendChild(item);
    });
  }

  drop.classList.toggle('show', drop.children.length > 0);
}

async function confirmAdd(containerId, widgetCol, value, inp, drop) {
  if (!value) return;

  const container = document.getElementById(containerId);
  const current   = JSON.parse(container.dataset.selected || '[]');
  if (current.includes(value)) { inp.value = ''; drop.classList.remove('show'); return; }

  const next = [...current, value];
  container.dataset.selected = JSON.stringify(next);
  renderCLTags(containerId, next);
  inp.value = '';
  drop.classList.remove('show');

  // Ajoute à la liste officielle Grist (évite le rouge)
  await addChoiceToColumn(widgetCol, value);

  // Sauvegarde la valeur dans l'enregistrement
  queueUpdate(widgetCol, encodeChoiceList(next));
}

function removeCLItem(containerId, value) {
  const container = document.getElementById(containerId);
  const widgetCol = container.dataset.widgetCol;
  const current   = JSON.parse(container.dataset.selected || '[]');
  const next      = current.filter(v => v !== value);
  container.dataset.selected = JSON.stringify(next);
  renderCLTags(containerId, next);
  queueUpdate(widgetCol, encodeChoiceList(next));
}

/* ═══════════════════════════════════════════════════════
   HELPERS CHAMPS
═══════════════════════════════════════════════════════ */
function sv(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val != null ? val : '';
}

function sta(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = val != null ? val : '';
  autoH(el);
}

function setMontant(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = (val != null && val !== '') ? fmtNum(parseFloat(val)) : '';
}

function fmtDate(val) {
  if (!val) return '—';
  const d = new Date(typeof val === 'number' ? val * 1000 : val);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('fr-FR', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
}

/* ═══════════════════════════════════════════════════════
   FORMATAGE MONTANTS
═══════════════════════════════════════════════════════ */
function fmtNum(n) {
  if (n == null || isNaN(n)) return '';
  return new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 }).format(n);
}

function parseNum(s) {
  if (!s && s !== 0) return null;
  const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.'));
  return isNaN(n) ? null : n;
}

function fmtMontant(el)   { const n = parseNum(el.value); el.value = n != null ? fmtNum(n) : ''; }
function unfmtMontant(el) { const n = parseNum(el.value); el.value = n != null ? String(n) : ''; }
function onMontant(el)    { queueUpdate(el.dataset.col, parseNum(el.value)); }

/* ═══════════════════════════════════════════════════════
   SAUVEGARDE AUTO
═══════════════════════════════════════════════════════ */
function onChange(el) { queueUpdate(el.dataset.col, el.value); }

function queueUpdate(col, val) {
  if (!col) return;
  pending[col] = val;
  setSave('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 850);
}

async function flush() {
  if (!currentRowId || !Object.keys(pending).length || isSaving) return;
  isSaving = true;
  const data = { ...pending };
  pending    = {};

  // Remapping noms internes → noms réels Grist
  const fields = {};
  for (const [k, v] of Object.entries(data)) {
    const real = currentMaps?.[k];
    if (real) fields[real] = v;
    else      fields[k]    = v;
  }

  try {
    await grist.selectedTable.update({ id: currentRowId, fields });
    setSave('saved');
    setTimeout(() => setSave('idle'), 2500);
  } catch(e) {
    console.error('Erreur sauvegarde', e);
    setSave('idle');
    toast('Erreur lors de la sauvegarde', 'err');
  } finally {
    isSaving = false;
  }
}

function setSave(state) {
  const el  = document.getElementById('saveInd');
  const lbl = document.getElementById('saveTxt');
  el.className = 'save-ind no-print';
  if      (state === 'saving') { el.classList.add('saving'); lbl.textContent = 'Enregistrement…'; }
  else if (state === 'saved')  { el.classList.add('saved');  lbl.textContent = 'Enregistré ✓'; }
  else lbl.textContent = 'Synchronisé';
}

/* ═══════════════════════════════════════════════════════
   UTILITAIRES
═══════════════════════════════════════════════════════ */
function autoH(el) {
  el.style.height = 'auto';
  el.style.height = Math.max(el.scrollHeight, 90) + 'px';
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `toast ${type || ''}`;
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
