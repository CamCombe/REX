<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fiches CORIFER</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    /* ===================== VARIABLES ===================== */
    :root {
      --bleu:        #1a3a5c;
      --bleu-clair:  #2563a8;
      --bleu-pale:   #e8f0f8;
      --gris-bg:     #f4f6f9;
      --gris-bord:   #d1d9e0;
      --gris-texte:  #5a6a7a;
      --blanc:       #ffffff;
      --rouge-doux:  #c0392b;
      --vert-doux:   #1e7e4a;
      --texte:       #1c2b3a;
      --radius:      8px;
      --radius-lg:   12px;
      --shadow:      0 1px 4px rgba(0,0,0,0.08), 0 2px 12px rgba(0,0,0,0.05);
      --shadow-lg:   0 4px 24px rgba(0,0,0,0.10);
      --transition:  0.17s ease;
    }

    /* ===================== RESET ===================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--gris-bg); color: var(--texte); font-size: 14px; line-height: 1.6; }

    /* ===================== LAYOUT ===================== */
    .app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* ===================== TOPBAR ===================== */
    .topbar {
      background: var(--blanc);
      border-bottom: 1.5px solid var(--gris-bord);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      z-index: 100;
    }
    .topbar-logo {
      display: flex; align-items: center; gap: 9px;
      text-decoration: none;
    }
    .topbar-logo-mark {
      width: 30px; height: 30px;
      background: var(--bleu);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .topbar-logo-mark svg { width: 17px; height: 17px; fill: white; }
    .topbar-logo-text { font-size: 14px; font-weight: 700; color: var(--bleu); letter-spacing: .3px; }
    .topbar-sep { width: 1px; height: 24px; background: var(--gris-bord); flex-shrink: 0; }
    .topbar-spacer { flex: 1; }

    /* ===================== SELECTOR ===================== */
    .selector-wrap { position: relative; min-width: 260px; max-width: 360px; flex: 1; }
    .selector-btn {
      width: 100%;
      background: var(--gris-bg);
      border: 1.5px solid var(--gris-bord);
      border-radius: var(--radius);
      padding: 7px 34px 7px 12px;
      font-family: inherit; font-size: 13.5px; font-weight: 500;
      color: var(--texte); cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 8px;
      transition: border-color var(--transition), box-shadow var(--transition);
      white-space: nowrap; overflow: hidden;
    }
    .selector-btn:hover { border-color: var(--bleu-clair); }
    .selector-btn.open { border-color: var(--bleu-clair); box-shadow: 0 0 0 3px rgba(37,99,168,.13); }
    .selector-btn-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .selector-btn-count {
      background: var(--bleu); color: white;
      font-size: 10px; font-weight: 700;
      border-radius: 20px; padding: 1px 7px;
      flex-shrink: 0;
    }
    .selector-chevron {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--gris-texte); pointer-events: none;
      transition: transform var(--transition);
    }
    .selector-btn.open ~ .selector-chevron { transform: translateY(-50%) rotate(180deg); }
    .selector-dropdown {
      display: none; flex-direction: column;
      position: absolute; top: calc(100% + 5px); left: 0; right: 0;
      background: var(--blanc);
      border: 1.5px solid var(--gris-bord);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      z-index: 999;
      max-height: 340px;
      overflow: hidden;
    }
    .selector-wrap.open .selector-dropdown { display: flex; }
    .selector-search-box {
      padding: 10px 10px 8px;
      border-bottom: 1px solid var(--gris-bord);
      flex-shrink: 0;
    }
    .selector-search-box input {
      width: 100%; border: 1.5px solid var(--gris-bord);
      border-radius: var(--radius); padding: 6px 10px;
      font-family: inherit; font-size: 13px;
      color: var(--texte); background: var(--gris-bg);
      outline: none; transition: border-color var(--transition);
    }
    .selector-search-box input:focus { border-color: var(--bleu-clair); }
    .selector-list { overflow-y: auto; flex: 1; }
    .selector-item {
      padding: 9px 14px; cursor: pointer;
      display: flex; align-items: center; gap: 9px;
      border-bottom: 1px solid var(--gris-bord);
      transition: background var(--transition);
    }
    .selector-item:last-child { border-bottom: none; }
    .selector-item:hover { background: var(--bleu-pale); }
    .selector-item.active { background: var(--bleu-pale); font-weight: 600; color: var(--bleu); }
    .selector-item-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gris-bord); flex-shrink: 0; }
    .selector-item.active .selector-item-dot { background: var(--bleu-clair); }
    .selector-item-name { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .selector-item-op { font-size: 11px; color: var(--gris-texte); flex-shrink: 0; }

    /* ===================== SAVE ===================== */
    .save-status {
      display: flex; align-items: center; gap: 5px;
      font-size: 12px; color: var(--gris-texte);
      flex-shrink: 0; min-width: 110px;
      transition: color var(--transition);
    }
    .save-status.saving { color: #c47c00; }
    .save-status.saved  { color: var(--vert-doux); }
    .save-status.error  { color: var(--rouge-doux); }
    .save-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* ===================== BUTTONS ===================== */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 13px; border-radius: var(--radius);
      font-family: inherit; font-size: 12.5px; font-weight: 500;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all var(--transition); white-space: nowrap; flex-shrink: 0;
    }
    .btn svg { width: 14px; height: 14px; }
    .btn-outline {
      background: transparent; border-color: var(--gris-bord); color: var(--gris-texte);
    }
    .btn-outline:hover { border-color: var(--bleu-clair); color: var(--bleu-clair); background: var(--bleu-pale); }
    .btn-primary { background: var(--bleu); color: white; border-color: var(--bleu); }
    .btn-primary:hover { background: var(--bleu-clair); border-color: var(--bleu-clair); }

    /* ===================== MAIN SCROLL ===================== */
    .main { flex: 1; overflow-y: auto; padding: 28px 24px; }

    /* ===================== EMPTY STATE ===================== */
    .empty-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 14px; color: var(--gris-texte);
      text-align: center;
    }
    .empty-state svg { width: 52px; height: 52px; opacity: .25; }
    .empty-state-title { font-size: 16px; font-weight: 500; color: var(--texte); opacity: .4; }
    .empty-state-sub { font-size: 13px; opacity: .6; }

    /* ===================== FICHE ===================== */
    .fiche { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

    /* En-tête de la fiche */
    .fiche-hero {
      background: var(--bleu);
      border-radius: var(--radius-lg);
      padding: 26px 30px 22px;
      color: white;
      box-shadow: var(--shadow);
    }
    .fiche-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
    .fiche-hero-name { font-size: 21px; font-weight: 700; line-height: 1.3; letter-spacing: -.2px; }
    .fiche-hero-op {
      background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.22);
      border-radius: 20px; padding: 3px 12px;
      font-size: 12px; font-weight: 500; white-space: nowrap; flex-shrink: 0;
    }
    .fiche-hero-meta { display: flex; flex-wrap: wrap; gap: 18px; }
    .fiche-hero-meta-item { display: flex; align-items: center; gap: 6px; font-size: 12.5px; opacity: .88; }
    .fiche-hero-meta-item svg { width: 14px; height: 14px; opacity: .7; }
    .badge-audition {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 600;
    }
    .badge-ok  { background: rgba(30,126,74,.18); color: #a3f7c4; border: 1px solid rgba(163,247,196,.25); }
    .badge-nok { background: rgba(192,57,43,.18);  color: #ffb3ae; border: 1px solid rgba(255,179,174,.25); }
    .badge-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* Cartes de section */
    .section {
      background: var(--blanc);
      border: 1px solid var(--gris-bord);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .section-head {
      padding: 13px 20px 12px;
      border-bottom: 1px solid var(--gris-bord);
      background: #fafbfc;
      display: flex; align-items: center; gap: 9px;
    }
    .section-icon {
      width: 26px; height: 26px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .section-icon svg { width: 14px; height: 14px; }
    .section-title { font-size: 12.5px; font-weight: 600; color: var(--bleu); text-transform: uppercase; letter-spacing: .6px; }
    .section-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 15px; }

    /* ===================== GRILLE DE CHAMPS ===================== */
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field-grid.cols3 { grid-template-columns: 1fr 1fr 1fr; }
    .field-full { grid-column: 1 / -1; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field-label {
      font-size: 10.5px; font-weight: 600; text-transform: uppercase;
      letter-spacing: .7px; color: var(--gris-texte);
    }

    /* ===================== INPUTS ===================== */
    .inp {
      background: var(--gris-bg); border: 1.5px solid var(--gris-bord);
      border-radius: var(--radius); padding: 7px 11px;
      font-family: inherit; font-size: 13.5px; color: var(--texte);
      width: 100%; outline: none; resize: none;
      transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
    }
    .inp:hover { border-color: #9eb4cc; background: var(--blanc); }
    .inp:focus { border-color: var(--bleu-clair); background: var(--blanc); box-shadow: 0 0 0 3px rgba(37,99,168,.10); }
    textarea.inp { min-height: 88px; line-height: 1.65; }
    textarea.inp.tall { min-height: 130px; }

    /* URL field */
    .inp-url-wrap { display: flex; }
    .inp-url-wrap .inp { border-radius: var(--radius) 0 0 var(--radius); border-right: none; }
    .inp-url-btn {
      display: flex; align-items: center; justify-content: center;
      width: 36px; background: var(--bleu-pale);
      border: 1.5px solid var(--gris-bord); border-left: none;
      border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--bleu-clair); text-decoration: none; flex-shrink: 0;
      transition: background var(--transition), color var(--transition);
    }
    .inp-url-btn:hover { background: var(--bleu-clair); color: white; }
    .inp-url-btn svg { width: 14px; height: 14px; }

    /* Toggle */
    .toggle-row { display: flex; align-items: center; gap: 10px; }
    .toggle { position: relative; width: 38px; height: 21px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0; border-radius: 11px;
      background: var(--gris-bord); cursor: pointer;
      transition: background var(--transition);
    }
    .toggle input:checked + .toggle-track { background: var(--bleu-clair); }
    .toggle-thumb {
      position: absolute; top: 2.5px; left: 2.5px;
      width: 16px; height: 16px; border-radius: 50%;
      background: white; box-shadow: 0 1px 3px rgba(0,0,0,.18);
      transition: transform var(--transition); pointer-events: none;
    }
    .toggle input:checked ~ .toggle-thumb { transform: translateX(17px); }
    .toggle-label { font-size: 13.5px; color: var(--texte); }

    /* ===================== MONTANTS ===================== */
    .montant-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .montant-card {
      background: var(--gris-bg); border: 1.5px solid var(--gris-bord);
      border-radius: var(--radius); padding: 12px 14px;
    }
    .montant-card.accent { border-color: #9eb4cc; background: var(--bleu-pale); }
    .montant-card-label { font-size: 10.5px; font-weight: 600; color: var(--gris-texte); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
    .montant-card.accent .montant-card-label { color: var(--bleu); }
    .montant-input-row { display: flex; align-items: baseline; gap: 4px; }
    .montant-input {
      flex: 1; border: none; background: transparent; outline: none;
      font-family: inherit; font-size: 18px; font-weight: 700; color: var(--texte);
      padding: 0; width: 100%;
    }
    .montant-card.accent .montant-input { color: var(--bleu); }
    .montant-input:focus { color: var(--bleu-clair); }
    .montant-unit { font-size: 12px; color: var(--gris-texte); }
    .montant-sub { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gris-bord); display: flex; flex-direction: column; gap: 7px; }
    .montant-sub-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .montant-sub-label { font-size: 12px; color: var(--gris-texte); }
    .montant-sub-inp-wrap { display: flex; align-items: center; gap: 3px; }
    .montant-sub-inp {
      width: 120px; text-align: right;
      border: 1.5px solid var(--gris-bord); border-radius: var(--radius);
      background: var(--blanc); padding: 4px 8px;
      font-family: inherit; font-size: 13px; font-weight: 600; color: var(--texte);
      outline: none; transition: border-color var(--transition);
    }
    .montant-sub-inp:focus { border-color: var(--bleu-clair); }
    .montant-sub-unit { font-size: 11px; color: var(--gris-texte); }

    /* ===================== TAGS ===================== */
    .tags-wrap {
      display: flex; flex-wrap: wrap; gap: 5px; align-items: flex-start;
      background: var(--gris-bg); border: 1.5px solid var(--gris-bord);
      border-radius: var(--radius); padding: 7px 9px; min-height: 40px;
      cursor: text; transition: border-color var(--transition), box-shadow var(--transition);
    }
    .tags-wrap:focus-within { border-color: var(--bleu-clair); background: var(--blanc); box-shadow: 0 0 0 3px rgba(37,99,168,.10); }
    .tag {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--bleu-pale); border: 1px solid #9eb4cc;
      color: var(--bleu); border-radius: 20px; padding: 2px 10px;
      font-size: 12px; font-weight: 500;
    }
    .tag-x { cursor: pointer; opacity: .5; font-size: 14px; line-height: 1; transition: opacity var(--transition); }
    .tag-x:hover { opacity: 1; }
    .tag-input {
      border: none; background: transparent; outline: none;
      font-family: inherit; font-size: 13px; color: var(--texte);
      min-width: 90px; flex: 1;
    }

    /* ===================== TOAST ===================== */
    .toast {
      position: fixed; bottom: 18px; right: 18px;
      background: var(--bleu); color: white;
      padding: 9px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      box-shadow: var(--shadow-lg); z-index: 9999;
      opacity: 0; transform: translateY(8px);
      transition: all .2s ease; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.ok  { background: var(--vert-doux); }
    .toast.err { background: var(--rouge-doux); }

    /* ===================== PRINT ===================== */
    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body { background: white; font-size: 10.5pt; }
      .app { height: auto; overflow: visible; }
      .topbar, .print-hide { display: none !important; }
      .main { overflow: visible; padding: 0; }
      .fiche { max-width: 100%; gap: 14pt; }
      .fiche-hero { background: var(--bleu) !important; border-radius: 8pt; padding: 18pt 22pt 14pt; }
      .section { break-inside: avoid; box-shadow: none; border: 1pt solid #d1d9e0; }
      .section-head { background: #fafbfc !important; }
      .inp, .montant-sub-inp { border: none; background: transparent; padding: 0; font-size: inherit; box-shadow: none; }
      textarea.inp { resize: none; overflow: visible; height: auto; }
      .tags-wrap { border: none; background: transparent; padding: 0; }
      .toggle-track, .toggle-thumb { display: none; }
      .toggle-label::before { content: attr(data-print); }
      .montant-grid { grid-template-columns: 1fr 1fr 1fr; }
    }

    /* scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--gris-bord); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9eb4cc; }
  </style>
</head>
<body>
<div class="app">

  <!-- ======= TOPBAR ======= -->
  <header class="topbar">
    <div class="topbar-logo">
      <div class="topbar-logo-mark">
        <svg viewBox="0 0 24 24"><path d="M20 6H4V4h16v2zm-2 4H6V8h12v2zm2 4H4v-2h16v2zm-2 4H6v-2h12v2z"/></svg>
      </div>
      <span class="topbar-logo-text">CORIFER</span>
    </div>
    <div class="topbar-sep"></div>

    <!-- Sélecteur de fiche -->
    <div class="selector-wrap print-hide" id="selectorWrap">
      <button class="selector-btn" id="selectorBtn" onclick="toggleSelector()">
        <span class="selector-btn-label" id="selectorLabel">Sélectionner une fiche…</span>
        <span class="selector-btn-count" id="selectorCount">0</span>
      </button>
      <svg class="selector-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
      <div class="selector-dropdown">
        <div class="selector-search-box">
          <input type="text" id="searchInp" placeholder="Rechercher…" oninput="filterSelector(this.value)"/>
        </div>
        <div class="selector-list" id="selectorList"></div>
      </div>
    </div>

    <div class="topbar-spacer"></div>

    <!-- Statut sauvegarde -->
    <div class="save-status" id="saveStatus">
      <span class="save-dot"></span>
      <span id="saveLabel">Synchronisé</span>
    </div>

    <!-- Boutons export -->
    <button class="btn btn-outline print-hide" onclick="window.print()" title="Imprimer ou exporter en PDF">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      PDF / Imprimer
    </button>
    <button class="btn btn-primary print-hide" onclick="exportDoc()" title="Exporter en DOCX">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      Exporter DOCX
    </button>
  </header>

  <!-- ======= CONTENU ======= -->
  <main class="main">

    <!-- État vide -->
    <div class="empty-state" id="emptyState">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <p class="empty-state-title">Aucune fiche sélectionnée</p>
      <p class="empty-state-sub">Choisissez un projet dans le sélecteur ci-dessus</p>
    </div>

    <!-- ===== FICHE ===== -->
    <div class="fiche" id="fiche" style="display:none;">

      <!-- Hero -->
      <div class="fiche-hero">
        <div class="fiche-hero-top">
          <div class="fiche-hero-name" id="heroName">—</div>
          <span class="fiche-hero-op" id="heroOp">—</span>
        </div>
        <div class="fiche-hero-meta">
          <div class="fiche-hero-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="heroDate">—</span>
          </div>
          <div class="fiche-hero-meta-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="heroHoraires">—</span>
          </div>
          <div id="heroAuditionWrap"></div>
        </div>
      </div>

      <!-- 1. Informations générales -->
      <div class="section">
        <div class="section-head">
          <div class="section-icon" style="background:#e8f0f8;">
            <svg viewBox="0 0 24 24" fill="none" stroke="#1a3a5c" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          </div>
          <span class="section-title">Informations générales</span>
        </div>
        <div class="section-body">

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ===================================================
// CONFIGURATION DU MAPPING
// data-grist = identifiant Grist attendu après mapping
// ===================================================

// Déclaration des colonnes pour le mapping Grist
const COLUMNS = [
  { name: 'Projet',                              title: 'Titre du projet',                  type: 'Text'     },
  { name: 'Operateur',                           title: 'Opérateur',                        type: 'Text'     },
  { name: 'Chef_de_file',                        title: 'Chef de file',                     type: 'Text'     },
  { name: 'Membres_du_consortium',               title: 'Membres du consortium',            type: 'Text'     },
  { name: 'Lien_vers_le_dossier_partage',        title: 'Lien vers le dossier partagé',     type: 'Text'     },
  { name: 'Debut',                               title: 'Date de début',                    type: 'DateTime' },
  { name: 'Fin',                                 title: 'Date de fin',                      type: 'DateTime' },
  { name: 'Horaires_affichage_',                 title: 'Horaires (affichage)',              type: 'Text'     },
  { name: 'Tenue_de_l_audition',                 title: "Tenue de l'audition",              type: 'Bool'     },
  { name: 'Participants_SPIN',                   title: 'Participants SPIN',                type: 'Text'     },
  { name: 'Participation_Etat',                  title: 'Participation État',               type: 'Text'     },
  { name: 'Participants_hors_SPIN',              title: 'Participants hors SPIN',           type: 'Text'     },
  { name: 'Montant_total_du_projet_en_',         title: 'Montant total du projet (€)',      type: 'Numeric'  },
  { name: 'Montant_total_d_aide_du_projet_en_',  title: "Montant total d'aide (€)",         type: 'Numeric'  },
  { name: 'Subventions',                         title: 'Subventions (€)',                  type: 'Numeric'  },
  { name: 'AR',                                  title: 'AR (€)',                           type: 'Numeric'  },
  { name: 'Projet_Presentation',                 title: 'Présentation',                     type: 'Text'     },
  { name: 'Projet_Objectifs',                    title: 'Objectifs',                        type: 'Text'     },
  { name: 'Projet_Avancement',                   title: 'Avancement',                       type: 'Text'     },
  { name: 'Projet_Freins_rencontres',            title: 'Freins rencontrés',                type: 'Text'     },
  { name: 'Projet_Potentiel_de_l_innovation',    title: "Potentiel de l'innovation",        type: 'Text'     },
  { name: 'Projet_Perspectives_de_developpement',title: 'Perspectives de développement',   type: 'Text'     },
  { name: 'Avis_SPIN',                           title: 'Avis SPIN',                        type: 'Text'     },
  { name: 'Avis_SFG',                            title: 'Avis SFG',                         type: 'Text'     },
];

// ===================================================
// ÉTAT
// ===================================================
let allRecords   = [];
let currentRowId = null;
let currentMaps  = null;   // mappings reçus de Grist
let pending      = {};
let saveTimer    = null;
let isSaving     = false;

// ===================================================
// INIT GRIST
// ===================================================
grist.ready({
  requiredAccess: 'full',
  columns: COLUMNS.map(c => ({
    name:     c.name,
    title:    c.title,
    type:     c.type,
    optional: c.name !== 'Projet',   // seul "Projet" est obligatoire pour le sélecteur
  }))
});

// Réception de toutes les lignes
grist.onRecords(function(records, mappings) {
  currentMaps = mappings;
  // On mappe chaque enregistrement avec les noms déclarés
  allRecords = records.map(r => {
    const mapped = grist.mapColumnNames(r, mappings);
    mapped.__id = r.id;
    return mapped;
  });
  document.getElementById('selectorCount').textContent = allRecords.filter(r => r && r.Projet).length;
  buildSelector();
  if (currentRowId !== null) {
    const r = allRecords.find(r => r.__id === currentRowId);
    if (r) fillFiche(r);
  }
});

// Réception de la ligne sélectionnée (curseur Grist)
grist.onRecord(function(record, mappings) {
  if (!record) return;
  currentMaps  = mappings;
  const mapped = grist.mapColumnNames(record, mappings);
  if (!mapped) return;
  mapped.__id  = record.id;
  currentRowId = record.id;
  highlightSelector(record.id);
  fillFiche(mapped);
});

// ===================================================
// SÉLECTEUR
// ===================================================
function buildSelector() {
  const list = document.getElementById('selectorList');
  const items = allRecords.filter(r => r && r.Projet);
  list.innerHTML = items.map(r => `
    <div class="selector-item ${r.__id === currentRowId ? 'active' : ''}"
         data-id="${r.__id}"
         onclick="selectRow(${r.__id})">
      <div class="selector-item-dot"></div>
      <span class="selector-item-name">${esc(r.Projet)}</span>
      <span class="selector-item-op">${esc(r.Operateur || '')}</span>
    </div>
  `).join('');
}

function filterSelector(q) {
  q = q.toLowerCase();
  document.querySelectorAll('.selector-item').forEach(el => {
    el.style.display = el.querySelector('.selector-item-name').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
}

function toggleSelector() {
  const wrap = document.getElementById('selectorWrap');
  const btn  = document.getElementById('selectorBtn');
  const open = wrap.classList.toggle('open');
  btn.classList.toggle('open', open);
  if (open) setTimeout(() => document.getElementById('searchInp').focus(), 40);
}

document.addEventListener('click', e => {
  const wrap = document.getElementById('selectorWrap');
  if (!wrap.contains(e.target)) {
    wrap.classList.remove('open');
    document.getElementById('selectorBtn').classList.remove('open');
  }
});

function selectRow(rowId) {
  currentRowId = rowId;
  highlightSelector(rowId);
  document.getElementById('selectorWrap').classList.remove('open');
  document.getElementById('selectorBtn').classList.remove('open');
  const r = allRecords.find(r => r.__id === rowId);
  if (r) {
    document.getElementById('selectorLabel').textContent = r.Projet || '—';
    fillFiche(r);
    grist.setCursorPos({ rowId }).catch(() => {});
  }
}

function highlightSelector(rowId) {
  document.querySelectorAll('.selector-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.id) === rowId);
  });
  const r = allRecords.find(r => r.__id === rowId);
  if (r) document.getElementById('selectorLabel').textContent = r.Projet || '—';
}

// ===================================================
// REMPLISSAGE DE LA FICHE
// ===================================================
function fillFiche(r) {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('fiche').style.display      = 'flex';

  // Hero
  document.getElementById('heroName').textContent     = r.Projet || '—';
  document.getElementById('heroOp').textContent       = r.Operateur || '—';
  document.getElementById('heroDate').textContent     = fmtDate(r.Debut);
  document.getElementById('heroHoraires').textContent = r.Horaires_affichage_ || '—';

  const tenue = !!r.Tenue_de_l_audition;
  document.getElementById('heroAuditionWrap').innerHTML = `
    <span class="badge-audition ${tenue ? 'badge-ok' : 'badge-nok'}">
      <span class="badge-dot"></span>${tenue ? 'Audition tenue' : 'Non tenue'}
    </span>`;

  // Champs simples
  sv('f_op',         r.Operateur);
  sv('f_chef',       r.Chef_de_file);
  sv('f_lien',       r.Lien_vers_le_dossier_partage);
  sv('f_horaires',   r.Horaires_affichage_);
  sv('f_montantTotal', r.Montant_total_du_projet_en_);
  sv('f_montantAide',  r.Montant_total_d_aide_du_projet_en_);
  sv('f_subventions',  r.Subventions);
  sv('f_ar',           r.AR);

  document.getElementById('f_lienBtn').href = r.Lien_vers_le_dossier_partage || '#';

  // Dates
  svDate('f_debut', r.Debut);
  svDate('f_fin',   r.Fin);

  // Toggle
  const cb = document.getElementById('f_tenue');
  cb.checked = tenue;
  document.getElementById('toggleLabel').textContent = tenue ? 'Audition tenue' : 'Audition non tenue';

  // Tags
  buildTags('tags_consortium', r.Membres_du_consortium);
  buildTags('tags_spin',       r.Participants_SPIN);
  buildTags('tags_etat',       r.Participation_Etat);
  buildTags('tags_horsspin',   r.Participants_hors_SPIN);

  // Textareas
  sta('f_pres',          r.Projet_Presentation);
  sta('f_obj',           r.Projet_Objectifs);
  sta('f_av',            r.Projet_Avancement);
  sta('f_freins',        r.Projet_Freins_rencontres);
  sta('f_potentiel',     r.Projet_Potentiel_de_l_innovation);
  sta('f_perspectives',  r.Projet_Perspectives_de_developpement);
  sta('f_avisSpin',      r.Avis_SPIN);
  sta('f_avisSfg',       r.Avis_SFG);

  pending = {};
}

function sv(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val != null ? val : '';
}
function sta(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = val != null ? val : '';
  autoH(el);
}
function svDate(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  if (!val) { el.value = ''; return; }
  const d = new Date(typeof val === 'number' ? val * 1000 : val);
  if (isNaN(d)) { el.value = ''; return; }
  const p = n => String(n).padStart(2, '0');
  el.value = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function fmtDate(val) {
  if (!val) return '—';
  const d = new Date(typeof val === 'number' ? val * 1000 : val);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

// ===================================================
// TAGS
// ===================================================
function buildTags(containerId, raw) {
  const c = document.getElementById(containerId);
  if (!c) return;
  c.innerHTML = '';
  const items = splitTags(raw);
  items.forEach(t => c.appendChild(makeTag(t, containerId)));
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'tag-input';
  inp.placeholder = items.length ? '+' : 'Ajouter…';
  inp.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ';') && inp.value.trim()) {
      e.preventDefault();
      c.insertBefore(makeTag(inp.value.trim(), containerId), inp);
      inp.value = '';
      saveTags(containerId);
    } else if (e.key === 'Backspace' && !inp.value) {
      const tags = c.querySelectorAll('.tag');
      if (tags.length) { tags[tags.length-1].remove(); saveTags(containerId); }
    }
  });
  inp.addEventListener('blur', () => {
    if (inp.value.trim()) {
      c.insertBefore(makeTag(inp.value.trim(), containerId), inp);
      inp.value = '';
      saveTags(containerId);
    }
  });
  c.appendChild(inp);
}

function makeTag(text, containerId) {
  const t = document.createElement('span');
  t.className = 'tag';
  t.innerHTML = `${esc(text)}<span class="tag-x" title="Supprimer">×</span>`;
  t.querySelector('.tag-x').onclick = () => { t.remove(); saveTags(containerId); };
  return t;
}

function saveTags(containerId) {
  const c   = document.getElementById(containerId);
  const col = c.dataset.grist;
  const val = [...c.querySelectorAll('.tag')].map(t => t.childNodes[0].textContent.trim()).join('; ');
  pending[col] = val;
  scheduleSave();
}

function splitTags(raw) {
  if (!raw) return [];
  return String(raw).split(/[;,]/).map(s => s.trim()).filter(Boolean);
}

// ===================================================
// SAUVEGARDE AUTO
// ===================================================
function onChange(el) {
  const col = el.dataset.grist;
  if (!col) return;
  let val;
  if (el.type === 'checkbox')       val = el.checked;
  else if (el.type === 'number')    val = el.value === '' ? null : parseFloat(el.value);
  else if (el.type === 'datetime-local') val = el.value ? new Date(el.value).getTime() / 1000 : null;
  else val = el.value;

  pending[col] = val;

  // Mise à jour live du hero
  if (col === 'Operateur')           { document.getElementById('heroOp').textContent = val || '—';
                                       document.getElementById('heroOp').textContent = val || '—'; }
  if (col === 'Horaires_affichage_') { document.getElementById('heroHoraires').textContent = val || '—'; }
  if (col === 'Tenue_de_l_audition') {
    document.getElementById('toggleLabel').textContent = val ? 'Audition tenue' : 'Audition non tenue';
    document.getElementById('heroAuditionWrap').innerHTML = `
      <span class="badge-audition ${val ? 'badge-ok' : 'badge-nok'}">
        <span class="badge-dot"></span>${val ? 'Audition tenue' : 'Non tenue'}
      </span>`;
  }
  if (col === 'Lien_vers_le_dossier_partage') {
    document.getElementById('f_lienBtn').href = val || '#';
  }

  scheduleSave();
}

function scheduleSave() {
  setSave('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 900);
}

async function flush() {
  if (!currentRowId || !Object.keys(pending).length) return;
  if (isSaving) { scheduleSave(); return; }
  isSaving = true;
  const data = { ...pending };
  pending = {};

  // Remapper les noms internes → noms réels Grist via mappings inverses
  const toSend = remapForSave(data);

  try {
    await grist.selectedTable.update({ id: currentRowId, fields: toSend });
    setSave('saved');
    setTimeout(() => setSave('idle'), 2500);
  } catch(e) {
    console.error('Erreur sauvegarde', e);
    setSave('error');
    toast('Erreur lors de la sauvegarde', 'err');
  } finally {
    isSaving = false;
  }
}

// Convertit les noms déclarés (data-grist) → noms réels de colonnes Grist
function remapForSave(data) {
  if (!currentMaps) return data;
  const out = {};
  for (const [widgetCol, val] of Object.entries(data)) {
    // currentMaps : { widgetColName: realColName }
    const realCol = currentMaps[widgetCol];
    if (realCol) out[realCol] = val;
    else out[widgetCol] = val;  // fallback si pas de mapping
  }
  return out;
}

function setSave(state) {
  const el  = document.getElementById('saveStatus');
  const lbl = document.getElementById('saveLabel');
  el.className = 'save-status' + (state !== 'idle' ? ` ${state}` : '');
  lbl.textContent = state === 'saving' ? 'Enregistrement…' : state === 'saved' ? 'Enregistré ✓' : state === 'error' ? 'Erreur !' : 'Synchronisé';
}

// ===================================================
// EXPORT DOCX (Word)
// ===================================================
function exportDoc() {
  if (!currentRowId) { toast('Aucune fiche sélectionnée', 'err'); return; }
  const r = allRecords.find(r => r.__id === currentRowId);
  if (!r) return;

  const fmt = v => (v != null && v !== '') ? new Intl.NumberFormat('fr-FR').format(v) + ' €' : '—';
  const fmtD = v => fmtDate(v);
  const nl = v => v ? String(v).replace(/\n/g, '<br/>') : '—';

  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
  <style>
    body { font-family: Calibri, Arial, sans-serif; color: #1c2b3a; font-size: 11pt; padding: 2cm; }
    h1 { font-size: 18pt; color: #1a3a5c; margin: 0 0 4pt; }
    h2 { font-size: 12pt; color: #1a3a5c; border-bottom: 1pt solid #1a3a5c; padding-bottom: 3pt; margin: 16pt 0 6pt; }
    .meta { color: #5a6a7a; font-size: 9.5pt; margin-bottom: 14pt; }
    .label { font-size: 8.5pt; font-weight: bold; text-transform: uppercase; color: #5a6a7a; letter-spacing: .5pt; }
    .val { font-size: 10.5pt; margin: 2pt 0 8pt; }
    .pre { font-size: 10.5pt; white-space: pre-wrap; background: #f4f6f9; padding: 8pt; border-left: 3pt solid #1a3a5c; margin: 3pt 0 10pt; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20pt; }
  </style></head><body>
  <h1>${esc(r.Projet || '—')}</h1>
  <p class="meta">${esc(r.Operateur || '')} — ${fmtD(r.Debut)}</p>
  <hr/>
  <h2>Informations générales</h2>
  <div class="grid">
    <div><p class="label">Opérateur</p><p class="val">${esc(r.Operateur||'—')}</p></div>
    <div><p class="label">Chef de file</p><p class="val">${esc(r.Chef_de_file||'—')}</p></div>
  </div>
  <p class="label">Membres du consortium</p><p class="val">${esc(r.Membres_du_consortium||'—')}</p>
  <p class="label">Lien dossier partagé</p><p class="val">${esc(r.Lien_vers_le_dossier_partage||'—')}</p>
  <h2>Audition</h2>
  <div class="grid">
    <div><p class="label">Date de début</p><p class="val">${fmtD(r.Debut)}</p></div>
    <div><p class="label">Date de fin</p><p class="val">${fmtD(r.Fin)}</p></div>
    <div><p class="label">Horaires</p><p class="val">${esc(r.Horaires_affichage_||'—')}</p></div>
    <div><p class="label">Tenue</p><p class="val">${r.Tenue_de_l_audition ? '✓ Oui' : '✗ Non'}</p></div>
  </div>
  <h2>Participants</h2>
  <p class="label">Participants SPIN</p><p class="val">${esc(r.Participants_SPIN||'—')}</p>
  <p class="label">Participation État</p><p class="val">${esc(r.Participation_Etat||'—')}</p>
  <p class="label">Participants hors SPIN</p><p class="val">${esc(r.Participants_hors_SPIN||'—')}</p>
  <h2>Financements</h2>
  <div class="grid">
    <div><p class="label">Montant total du projet</p><p class="val">${fmt(r.Montant_total_du_projet_en_)}</p></div>
    <div><p class="label">Montant total d'aide</p><p class="val">${fmt(r.Montant_total_d_aide_du_projet_en_)}</p></div>
    <div><p class="label">Subventions</p><p class="val">${fmt(r.Subventions)}</p></div>
    <div><p class="label">AR</p><p class="val">${fmt(r.AR)}</p></div>
  </div>
  <h2>Fiche projet</h2>
  <p class="label">Présentation</p><div class="pre">${nl(r.Projet_Presentation)}</div>
  <p class="label">Objectifs</p><div class="pre">${nl(r.Projet_Objectifs)}</div>
  <p class="label">Avancement</p><div class="pre">${nl(r.Projet_Avancement)}</div>
  <p class="label">Freins rencontrés</p><div class="pre">${nl(r.Projet_Freins_rencontres)}</div>
  <p class="label">Potentiel de l'innovation</p><div class="pre">${nl(r.Projet_Potentiel_de_l_innovation)}</div>
  <p class="label">Perspectives de développement</p><div class="pre">${nl(r.Projet_Perspectives_de_developpement)}</div>
  <h2>Avis</h2>
  <div class="grid">
    <div><p class="label">Avis SPIN</p><div class="pre">${nl(r.Avis_SPIN)}</div></div>
    <div><p class="label">Avis SFG</p><div class="pre">${nl(r.Avis_SFG)}</div></div>
  </div>
  </body></html>`;

  const blob = new Blob([html], { type: 'application/msword' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `Fiche_${(r.Projet||'projet').replace(/[^a-zA-Z0-9]/g,'_')}.doc`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Export lancé ✓', 'ok');
}

// ===================================================
// UTILITAIRES
// ===================================================
function autoH(el) {
  el.style.height = 'auto';
  el.style.height = Math.max(el.scrollHeight, 88) + 'px';
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function toast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className   = `toast ${type}`;
  void t.offsetWidth;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
</script>
